    syn:{a:"A",b:"B",c:"C",d:"D",e:"E"}},
 "Quick-fire 2: validation, search, k-fold, hyperparameters":
   {kind:"tokens", answer:[["B","B","C","B"]], fmt:"Q9, Q10, Q11, Q16 as letters — e.g. A D C B",
    syn:{a:"A",b:"B",c:"C",d:"D"}},
 "Mean squared error":
   {kind:"tokens", answer:[["D"]], fmt:"a letter", syn:{a:"A",b:"B",c:"C",d:"D"}},
 "Quick-fire 3: trees, forests, regularisation":
   {kind:"tokens", answer:[["B","C","B","B","C","D"]], fmt:"Q12, Q13, Q14, Q15, Q17, Q20 as letters — e.g. A D C B A C",
    syn:{a:"A",b:"B",c:"C",d:"D"}},
 "Quick-fire 4: gradient descent":
   {kind:"tokens", answer:[["B","C"]], fmt:"Q18 then Q19, as letters — e.g. A D",
    syn:{a:"A",b:"B",c:"C",d:"D"}},
 "The update step, and the learning rate":
   {kind:"choice", choices:["The learning rate is too high — lower it",
     "The learning rate is too low — raise it","It is stuck in a local minimum — restart elsewhere",
     "Too few epochs — train for longer"], answer:0},
 "Batch, stochastic, mini-batch":
   {kind:"numbers", answer:[1,20,1000], fmt:"updates per epoch: batch, mini-batch, stochastic"},
 "Hyperparameter search: grid, random, Bayesian":
   {kind:"numbers", answer:[300], fmt:"the number of fits during the search"}
};

function autoMark(chk, given){
  if(chk.kind === "choice") return given === chk.answer;
  if(chk.kind === "numbers"){
    const nums = (String(given).match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    return nums.length >= chk.answer.length &&
      chk.answer.every((v,i) => Math.abs(nums[i] - v) < 1e-9);
  }
  const toks = String(given).toLowerCase().split(/[\s,;/()]+/)
    .map(t => t.replace(/[.:)]+$/,"")).filter(Boolean)
    .map(t => chk.syn[t]).filter(Boolean);
  return chk.answer.some(a => a.length === toks.length && a.every((v,i) => v === toks[i]));
}
function autoExpected(chk){
  if(chk.kind === "choice") return chk.choices[chk.answer];
  if(chk.kind === "numbers") return chk.answer.join(", ");
  return chk.answer[0].join(" ");
}

/* ---------------------------------------------------------------- drill -- */
function startDrill(items){
  queue = items.slice();
  for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  qi = 0; runOk = 0; answered = false; autoOk = null; autoGiven = null;
  setMode("drill");
}

function renderDrill(){
  if(!queue.length){
    const all = [];
    weeks().forEach((w,i) => w.concepts.forEach((_,j) => all.push({w:i,c:j})));
    view.innerHTML = `
      <p class="eyebrow">${esc(HALF[half].name)}</p>
      <h2>Drill</h2>
      <p class="lede">Questions from the concepts, in random order. Where the answer is exact — a
        number, a letter, a choice — the page marks it, and you can overrule it. Where the answer is
        an explanation, you write it first and then judge it against the model answer. Either way,
        what you get wrong comes back.</p>
      <div class="pager">
        <button class="btn primary" id="d-all">All ${all.length} concepts</button>
        <button class="btn" id="d-week">This week only</button>
      </div>`;
    $("#d-all").onclick = () => startDrill(all);
    $("#d-week").onclick = () => startDrill(weeks()[wi].concepts.map((_,j) => ({w:wi,c:j})));
    return;
  }
  if(qi >= queue.length){
    const pct = Math.round(100*runOk/queue.length);
    view.innerHTML = `
      <div class="card" style="max-width:620px">
        <p class="eyebrow">Run finished</p>
        <h2>${runOk} of ${queue.length}</h2>
        <p class="lede" style="margin:8px 0 20px">${
          pct === 100 ? "Clean run. Do it again in three days, not tomorrow — the gap is what makes it stick."
          : pct >= 70 ? "Solid. The ones you marked wrong are waiting on the overview page."
          : "Worth re-reading the week in Learn before drilling it again."}</p>
        <div class="pager">
          <button class="btn primary" id="again">Run again</button>
          <button class="btn" id="home">Back to overview</button>
        </div>
      </div>`;
    $("#again").onclick = () => startDrill(queue);
    $("#home").onclick = () => setMode("home");
    return;
  }

  const it = queue[qi], w = weeks()[it.w], c = w.concepts[it.c];
  const k = cKey(half,it.w,it.c);
  const chk = CHECK[c.t];
  const advance = ok => {
    queue[qi].ok = ok;
    if(ok){ runOk++; S.drilled[k]=1; delete S.wrong[k]; }
    else { S.wrong[k]=1; delete S.drilled[k]; }
    save(); qi++; answered=false; autoOk=null; autoGiven=null; render();
  };
  const model = `<div class="verdict ok" style="margin-bottom:6px">
      <h4>Model answer</h4>
      <p>${c.cp.a}</p>
      <p style="color:var(--ink-faint);font-size:13.5px;margin:0">${esc(c.cite)} — “${esc(c.t)}”</p>
    </div>`;
  let inner;
  if(chk && !answered){
    inner = chk.kind === "choice"
      ? `<div class="opts">${chk.choices.map((o,i) =>
          `<button class="opt" data-i="${i}"><span class="opt-k">${"abcdef"[i]})</span>${esc(o)}</button>`).join("")}</div>
         <div class="pager"><button class="btn ghost" id="skip">Skip</button>
           <span class="auto-tag">marked automatically</span></div>`
      : `<form class="auto-form" id="auto-form">
           <input class="auto-in" id="auto-in" autocomplete="off" spellcheck="false"
             placeholder="${esc(chk.fmt)}" aria-label="Your answer">
           <button class="btn primary" type="submit">Check</button>
         </form>
         <div class="pager"><button class="btn ghost" id="reveal">Reveal</button>
           <button class="btn ghost" id="skip">Skip</button>
           <span class="auto-tag">marked automatically</span></div>`;
  } else if(chk){
    const shown = chk.kind === "choice"
      ? `<div class="opts">${chk.choices.map((o,i) =>
          `<button class="opt ${i===chk.answer?"right":(i===autoGiven?"wrong":"")}" disabled><span class="opt-k">${"abcdef"[i]})</span>${esc(o)}</button>`).join("")}</div>`
      : `<p class="auto-given">You wrote: <code>${autoGiven===null?"— (revealed)":esc(autoGiven)}</code></p>`;
    inner = `${shown}
      <div class="verdict ${autoOk?"ok":"no"}">
        <h4>${autoOk?"✓ Correct":"✗ Not quite"}</h4>
        <p>Answer: <strong>${esc(autoExpected(chk))}</strong></p>
      </div>
      ${model}
      <div class="pager">
        <button class="btn primary" id="auto-next">Next →</button>
        <button class="btn ghost" id="auto-flip">${autoOk
          ? "Mark it wrong — I guessed"
          : (autoGiven===null ? "" : "I had it — count it")}</button>
      </div>`;
  } else {
    inner = `<textarea class="ans" id="ans" placeholder="Answer in your own words. Writing it badly still beats reading the answer."
          ${answered?"disabled":""}></textarea>
        ${answered ? `${model}
          <div class="pager">
            <button class="btn primary" id="had">I had that</button>
            <button class="btn" id="missed">I didn't</button>
          </div>`
        : `<div class="pager">
            <button class="btn primary" id="show">Show the answer</button>
            <button class="btn ghost" id="skip">Skip</button>
           </div>`}`;
  }
  view.innerHTML = `
    <div style="max-width:720px">
      <div class="meter">${queue.map((_,i) =>
        `<span class="pip ${i<qi?(queue[i].ok?"ok":"no"):(i===qi?"now":"")}"></span>`).join("")}</div>
      <p class="score">${qi+1} of ${queue.length} · ${runOk} right · ${esc(w.uke)} ${esc(w.topic)}</p>
      <div class="card">
        <p class="q">${esc(c.cp.q)}</p>
        ${inner}
      </div>
      ${S.wrong[k] ? `<p class="score" style="margin-top:12px;color:var(--wrong)">
        Marked shaky on an earlier run.</p>` : ""}
    </div>`;

  const skip = $("#skip");
  if(skip) skip.onclick = () => advance(false);
  if(chk && !answered){
    view.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      autoGiven = +b.dataset.i; autoOk = autoMark(chk, autoGiven); answered = true; render();
    });
    const f = $("#auto-form");
    if(f){
      const inp = $("#auto-in"); inp.focus();
      f.onsubmit = e => { e.preventDefault(); if(!inp.value.trim()) return;
        autoGiven = inp.value.trim(); autoOk = autoMark(chk, autoGiven); answered = true; render(); };
      $("#reveal").onclick = () => { autoGiven = null; autoOk = false; answered = true; render(); };
    }
  } else if(chk){
    $("#auto-next").onclick = () => advance(autoOk);
    const flip = $("#auto-flip");
    if(!flip.textContent.trim()) flip.remove();
    else flip.onclick = () => advance(!autoOk);
    $("#auto-next").focus();
  } else if(!answered){
    const a = $("#ans"); if(a) a.focus();
    $("#show").onclick = () => { answered = true; render(); };
  } else {
    $("#had").onclick = () => advance(true);
    $("#missed").onclick = () => advance(false);
  }
}

/* ----------------------------------------------------------------- work -- */
function renderWork(){
  const w = weeks()[wi], W = WORK[half][w.n];
  view.innerHTML = `
    <p class="eyebrow">${esc(w.uke)} · ${esc(HALF[half].name)} week ${w.n}</p>
    <h2>${esc(w.topic)}</h2>
    <p class="lede">Paper first. The V2025 exam asks for hand traces and written arguments, and
      the compulsory exercises are drawn by hand, so the pen goes before the keyboard.</p>
    <div class="card" style="margin-bottom:20px">
      <span class="badge">On paper</span>
      <div style="margin-top:14px">
        ${W.paper.map((p,i) => {
          const k = half+":"+w.n+":p"+i;
          return `<div class="work-item">
            <button class="tick" data-k="${k}" aria-pressed="${!!S.work[k]}"
              aria-label="Mark done">${S.work[k]?"✓":""}</button>
            <div><p class="work-d">${esc(p)}</p></div></div>`;
        }).join("")}
      </div>
    </div>
    <div class="card">
      <span class="badge">In the terminal</span>
      ${W.tut ? `<p class="work-b" style="margin-top:14px">${TUT[W.tut]} automatic checks in
        <code>tutorial/${W.tut}</code></p>
      <p class="work-d">Unimplemented stubs report as <code>todo</code>, not <code>FAIL</code>,
        so work one exercise at a time and watch the count climb. When it is green, ask me for an
        idiom review — the tests cannot tell you your fifteen lines should have been two.</p>
      <div class="cmd">cd tutorial &amp;&amp; ./check.py ${W.tut}</div>`
      : W.note ? `<p class="work-d" style="margin-top:14px">${esc(W.note)}</p>`
      : `<p class="work-b" style="margin-top:14px">No tutorial week for this yet</p>
      <p class="work-d">Tutorial weeks are written one at a time, against the slides the lecturer
        has actually posted. Ask for the one that covers this week.</p>
      <div class="cmd">cd tutorial &amp;&amp; ./check.py --list</div>`}
    </div>
    <div class="pager">
      <button class="btn" id="w-prev" ${wi===0?"disabled":""}>← Previous week</button>
      <button class="btn" id="w-next" ${wi===weeks().length-1?"disabled":""}>Next week →</button>
      <button class="btn primary" id="w-learn">Read this week</button>
    </div>`;
  view.querySelectorAll(".tick").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(S.work[k]) delete S.work[k]; else S.work[k] = 1;
    save(); render();
  });
  $("#w-prev").onclick = () => { if(wi>0){wi--;ci=0;render();} };
  $("#w-next").onclick = () => { if(wi<weeks().length-1){wi++;ci=0;render();} };
  $("#w-learn").onclick = () => setMode("learn");
}

/* ----------------------------------------------------------------- boot -- */
function render(){
  renderRibbon();
  if(mode === "start") renderStart();
  else if(mode === "home") renderHome();
  else if(mode === "learn") renderLearn();
  else if(mode === "drill") renderDrill();
  else renderWork();
  window.scrollTo({top:0,behavior:"instant"});
}

document.addEventListener("keydown", e => {
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if(mode === "learn"){
    if(e.key === "ArrowRight"){ const b=$("#next"); if(b && !b.disabled) b.click(); }
    if(e.key === "ArrowLeft"){ const b=$("#prev"); if(b && !b.disabled) b.click(); }
  }
  if(mode === "drill"){
    if(e.key === "Enter" && !answered){ const b=$("#show"); if(b) b.click(); }
    if(e.key === "Enter" && answered){ const b=$("#auto-next"); if(b){ e.preventDefault(); b.click(); } }
    if(answered && (e.key === "y" || e.key === "1")){ const b=$("#had"); if(b) b.click(); }
    if(answered && (e.key === "n" || e.key === "2")){ const b=$("#missed"); if(b) b.click(); }
  }
});

/* Open on the half being taught this week — the ribbon should agree with the
   calendar the moment the page loads. */
const todays = PLAN.find(p => p.uke === NOW_UKE);
if(todays) half = todays.half;
document.body.dataset.half = half;
document.querySelectorAll(".half-btn").forEach(b =>
  b.setAttribute("aria-pressed", String(b.dataset.half === half)));
$("#today").textContent = "uke " + NOW_UKE + " · exam 8 Dec";
render();
</script>
