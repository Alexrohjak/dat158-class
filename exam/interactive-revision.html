<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAT158 Drill Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#e9eef0; --surface:#fbfcfc; --sunk:#dfe6e9;
  --ink:#14212a; --ink-soft:#3d525c; --ink-faint:#6b8189;
  --rule:#c9d6da; --rule-soft:#dde6e9;
  --alg:#2e6e82; --alg-tint:#d8e8ed; --alg-ink:#1d4b5a;
  --ml:#9a6b14; --ml-tint:#f0e5cd; --ml-ink:#6d4b0d;
  --right:#2f7a4f; --right-tint:#d9ecdf;
  --wrong:#b3402f; --wrong-tint:#f4dcd8;
  --accent:var(--alg); --accent-tint:var(--alg-tint); --accent-ink:var(--alg-ink);
  --shadow:0 1px 2px rgba(20,33,42,.06),0 4px 14px rgba(20,33,42,.05);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  --ground:#0d1418; --surface:#141f25; --sunk:#0a1013;
  --ink:#e3ecef; --ink-soft:#a6bcc4; --ink-faint:#6f8b95;
  --rule:#27383f; --rule-soft:#1d2c32;
  --alg:#63b3ca; --alg-tint:#16323c; --alg-ink:#9ad2e2;
  --ml:#d9a949; --ml-tint:#3a2d12; --ml-ink:#eccb88;
  --right:#5fb583; --right-tint:#152e21;
  --wrong:#e0765f; --wrong-tint:#331b16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0d1418; --surface:#141f25; --sunk:#0a1013;
  --ink:#e3ecef; --ink-soft:#a6bcc4; --ink-faint:#6f8b95;
  --rule:#27383f; --rule-soft:#1d2c32;
  --alg:#63b3ca; --alg-tint:#16323c; --alg-ink:#9ad2e2;
  --ml:#d9a949; --ml-tint:#3a2d12; --ml-ink:#eccb88;
  --right:#5fb583; --right-tint:#152e21;
  --wrong:#e0765f; --wrong-tint:#331b16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased}
[data-half="ml"]{--accent:var(--ml);--accent-tint:var(--ml-tint);--accent-ink:var(--ml-ink)}
a{color:var(--accent-ink)}
code,kbd{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule);box-shadow:var(--shadow)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 22px 0;
  display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.brand{font:600 20px/1 var(--serif);letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--ink-faint);font:400 12px/1 var(--sans);
  letter-spacing:.09em;text-transform:uppercase;margin-left:10px}
.halves{display:flex;gap:6px}
.half-btn{font:500 13px/1 var(--sans);padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft)}
.half-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.half-btn.alg[aria-pressed="true"]{background:var(--alg);border-color:var(--alg)}
.half-btn.ml[aria-pressed="true"]{background:var(--ml);border-color:var(--ml)}
.modes{display:flex;gap:2px;max-width:1080px;margin:12px auto 0;padding:0 22px}
.mode-btn{font:500 13px/1 var(--sans);padding:10px 16px;cursor:pointer;background:none;
  border:none;border-bottom:2px solid transparent;color:var(--ink-faint)}
.mode-btn[aria-pressed="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}

/* ---------- the week ribbon: the alternation, made visible ---------- */
.ribbon{max-width:1080px;margin:0 auto;padding:12px 22px 14px;
  display:flex;gap:3px;overflow-x:auto}
.rib{flex:1 0 auto;min-width:44px;border:none;cursor:pointer;padding:6px 4px 5px;
  border-radius:4px;background:var(--sunk);color:var(--ink-faint);
  font:500 11px/1.35 var(--mono);text-align:center;position:relative}
.rib b{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.rib.is-alg{background:var(--alg-tint);color:var(--alg-ink)}
.rib.is-alg b{color:var(--alg-ink)}
.rib.is-ml{background:var(--ml-tint);color:var(--ml-ink)}
.rib.is-ml b{color:var(--ml-ink)}
.rib.now{outline:2px solid var(--ink);outline-offset:1px}
.rib.dim{opacity:.42}
.ribbon-note{max-width:1080px;margin:0 auto;padding:0 22px 14px;
  font:400 12.5px/1.5 var(--sans);color:var(--ink-faint)}
.ribbon-note b{color:var(--ink-soft);font-weight:500}

/* ---------- page ---------- */
main{max-width:1080px;margin:0 auto;padding:26px 22px 90px}
.lede{font:400 18px/1.65 var(--serif);color:var(--ink-soft);max-width:64ch;margin:0 0 26px}
h2{font:600 26px/1.25 var(--serif);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
h3{font:600 19px/1.3 var(--serif);margin:0 0 4px;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px}
.cite{font:400 12px/1 var(--mono);color:var(--ink-faint);margin:0 0 14px}

.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:10px;
  padding:24px 26px;box-shadow:var(--shadow)}
.prose{max-width:66ch}
.prose p{margin:0 0 13px}
.prose ul{margin:0 0 13px;padding-left:20px}
.prose li{margin:0 0 5px}
.prose strong{font-weight:600}
pre{background:var(--sunk);border:1px solid var(--rule-soft);border-radius:7px;
  padding:14px 16px;overflow-x:auto;margin:0 0 15px;
  font:400 13.5px/1.6 var(--mono);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;margin:0 0 15px;font-size:14.5px;
  font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--rule-soft)}
.tbl th{font:500 12px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.scroll{overflow-x:auto}

/* ---------- learn ---------- */
.learn-grid{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.learn-grid{grid-template-columns:1fr}}
.toc{display:flex;flex-direction:column;gap:3px;position:sticky;top:190px}
@media (max-width:820px){.toc{position:static;top:auto}}
.toc-b{text-align:left;font:400 13.5px/1.4 var(--sans);padding:9px 12px;border-radius:7px;
  border:none;background:none;cursor:pointer;color:var(--ink-soft);display:flex;gap:9px}
.toc-b:hover{background:var(--sunk)}
.toc-b[aria-current="true"]{background:var(--accent-tint);color:var(--accent-ink);font-weight:500}
.toc-n{font:500 11px/1.5 var(--mono);color:var(--ink-faint);flex:0 0 auto}
.toc-b[aria-current="true"] .toc-n{color:var(--accent-ink)}
.seen{color:var(--right)}
.pager{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{font:500 14px/1 var(--sans);padding:11px 18px;border-radius:8px;cursor:pointer;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1418}}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}

/* ---------- drill ---------- */
.q{font:400 20px/1.5 var(--serif);margin:0 0 18px;max-width:60ch;text-wrap:balance}
.ans{width:100%;font:400 15px/1.6 var(--sans);padding:13px 15px;border-radius:8px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  min-height:98px;resize:vertical}
.ans:focus{border-color:var(--accent)}
.verdict{border-radius:8px;padding:16px 18px;margin:16px 0 0;border:1px solid}
.verdict.ok{background:var(--right-tint);border-color:var(--right)}
.verdict.no{background:var(--wrong-tint);border-color:var(--wrong)}
.verdict h4{margin:0 0 8px;font:600 14px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.verdict.ok h4{color:var(--right)} .verdict.no h4{color:var(--wrong)}
.verdict p{margin:0 0 8px;font-size:15px}
.hint{background:var(--sunk);border-left:3px solid var(--accent);padding:12px 16px;
  border-radius:0 7px 7px 0;margin:0 0 12px;font-size:14.5px;color:var(--ink-soft)}
.meter{display:flex;gap:4px;margin:0 0 20px}
.pip{height:5px;flex:1;border-radius:3px;background:var(--sunk)}
.pip.ok{background:var(--right)} .pip.no{background:var(--wrong)} .pip.now{background:var(--accent)}
.score{font:500 13px/1 var(--mono);color:var(--ink-faint);margin:0 0 8px;
  font-variant-numeric:tabular-nums}

/* ---------- work ---------- */
.work-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule-soft);align-items:flex-start}
.work-item:last-child{border-bottom:none}
.tick{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule);
  background:var(--surface);cursor:pointer;margin-top:2px;color:var(--right);
  font:600 13px/1 var(--sans);display:grid;place-items:center;padding:0}
.tick[aria-pressed="true"]{background:var(--right-tint);border-color:var(--right)}
.work-b{font:500 15px/1.45 var(--sans);margin:0 0 3px}
.work-d{font:400 14px/1.55 var(--sans);color:var(--ink-soft);margin:0}
.cmd{display:inline-block;background:var(--sunk);border:1px solid var(--rule-soft);
  border-radius:6px;padding:8px 12px;font:400 13px/1 var(--mono);margin:6px 0 0}
.badge{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
  padding:5px 9px;border-radius:5px;background:var(--accent-tint);color:var(--accent-ink)}

/* ---------- home ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin:0 0 26px}
.stat{background:var(--surface);border:1px solid var(--rule-soft);border-radius:10px;padding:16px 18px}
.stat b{display:block;font:600 28px/1.1 var(--serif);font-variant-numeric:tabular-nums;
  color:var(--accent-ink);margin:0 0 3px}
.stat span{font:400 12.5px/1.35 var(--sans);color:var(--ink-faint)}
.wk-list{display:grid;gap:10px}
.wk{display:flex;gap:15px;align-items:baseline;background:var(--surface);
  border:1px solid var(--rule-soft);border-radius:9px;padding:14px 17px;cursor:pointer;
  text-align:left;width:100%;font:inherit;color:inherit}
.wk:hover{border-color:var(--accent)}
.wk-n{font:500 12px/1 var(--mono);color:var(--ink-faint);flex:0 0 46px}
.wk-t{font:500 15px/1.4 var(--sans);flex:1 1 auto}
.wk-t em{display:block;font:400 13px/1.45 var(--sans);font-style:normal;color:var(--ink-faint);margin-top:2px}
.wk-p{font:500 12px/1 var(--mono);color:var(--ink-faint);flex:0 0 auto;font-variant-numeric:tabular-nums}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);
  font:400 13px/1.6 var(--sans);color:var(--ink-faint);max-width:66ch}
.foot code{background:var(--sunk);padding:2px 5px;border-radius:4px}

/* ---------- plain-language box ---------- */
.plain{background:var(--accent-tint);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:14px 18px;margin:0 0 18px;max-width:66ch}
.plain b{display:block;font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 7px}
.plain p{margin:0;font:400 16px/1.6 var(--serif);color:var(--ink)}

/* ---------- demo shell ---------- */
.demo{background:var(--surface);border:1px solid var(--rule-soft);border-radius:10px;
  padding:20px 22px;margin:18px 0 0;box-shadow:var(--shadow)}
.demo-h{font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.demo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.demo-n{font:400 13.5px/1.6 var(--sans);color:var(--ink-faint);margin:12px 0 0;max-width:70ch}
.demo-k{font:500 14px/1.6 var(--mono);color:var(--ink-soft);margin:12px 0 0;
  font-variant-numeric:tabular-nums}
.demo-k b{color:var(--accent-ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
.fld{display:flex;flex-direction:column;gap:5px;font:400 12px/1 var(--sans);color:var(--ink-faint)}
.fld.wide{width:100%;max-width:420px;margin:0 0 14px}
.fld input[type=text],.fld input:not([type]){}
.fld input{font:400 14px/1 var(--mono);padding:9px 11px;border-radius:7px;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink);
  width:100%;max-width:38ch}
.fld.wide input{max-width:none}
.fld input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent);width:100%}
.fld b{color:var(--accent-ink);font:500 13px/1 var(--mono)}
.chip{font:500 12.5px/1 var(--sans);padding:8px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1418}}
.btn.sm{font-size:13px;padding:8px 13px}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--ink-faint)}
.ok-t{color:var(--right)} .bad-t{color:var(--wrong)}
.wrapline{line-height:2.1}
.chipx{display:inline-block;font:400 12.5px/1 var(--mono);padding:5px 8px;border-radius:5px;
  background:var(--sunk);color:var(--ink-soft);border:1px solid transparent}
.chipx.on{background:var(--right-tint);border-color:var(--right);color:var(--right)}

/* ---------- tape (text / pattern) ---------- */
.tape{display:flex;align-items:center;gap:10px;margin:0 0 8px;overflow-x:auto;padding-bottom:2px}
.tape-l{font:500 12px/1 var(--mono);color:var(--ink-faint);flex:0 0 14px}
.mono-row{display:flex;gap:8px}
.cell{display:grid;place-items:center;width:1ch;min-width:1ch;padding:7px 8px;border-radius:5px;
  font:500 14px/1 var(--mono);background:var(--sunk);color:var(--ink-soft);
  border:1px solid transparent;white-space:pre}
.cell.win{background:var(--accent-tint);color:var(--accent-ink)}
.cell.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.cell.good{background:var(--right-tint);color:var(--right);border-color:var(--right)}
.cell.bad{background:var(--wrong-tint);color:var(--wrong);border-color:var(--wrong)}
.cell.hit{background:var(--right);color:#fff;border-color:var(--right)}
.cell.muted{background:none;color:var(--ink-faint);font-size:11px}
.cell.ghost{visibility:hidden}

/* ---------- trie ---------- */
.tgrid{display:grid;grid-template-columns:minmax(190px,1fr) minmax(220px,1.1fr);gap:20px}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
.tbox{background:var(--sunk);border:1px solid var(--rule-soft);border-radius:8px;padding:12px}
.tscroll{max-height:290px;overflow:auto}
.tnode{padding:1px 0}
.tlab{display:inline-block;font:500 12.5px/1 var(--mono);padding:4px 8px;border-radius:5px;
  background:var(--surface);border:1px solid var(--rule-soft);color:var(--ink-soft)}
.tlab.tleaf{background:var(--right-tint);border-color:var(--right);color:var(--right)}

/* ---------- bars ---------- */
.bars{display:grid;gap:9px;margin:16px 0 0}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:11px;align-items:center;
  font:400 13px/1 var(--sans);color:var(--ink-soft)}
.bar i{height:11px;border-radius:6px;background:var(--accent);display:block}
.bar i.alt{background:var(--rule)}
.bar b{font:500 13px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- grid tables ---------- */
.tbl.grid td,.tbl.grid th{border:1px solid var(--rule-soft);text-align:center;padding:6px 9px}
.lc{font-family:var(--mono);color:var(--ink-faint)}
.lc.dg{background:var(--sunk);color:var(--ink-soft)}
.lc.on{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}

/* ---------- plots ---------- */
.plot{width:100%;max-width:420px;height:auto;display:block;margin:6px 0 0}
.ax{stroke:var(--rule);stroke-width:1}
.axt{fill:var(--ink-faint);font:11px var(--sans)}
.diag{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}
.roc{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.fitline{stroke:var(--accent);stroke-width:2}
.pt{fill:var(--ink-soft)}
.vline{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3}
.predA{fill:var(--accent)} .predB{fill:var(--wrong)}
.key{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.key.a{background:var(--accent)} .key.b{background:var(--wrong)}
.pt-v{fill:none;stroke:var(--wrong);stroke-width:1.2;opacity:.7}
.curve{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.curve-v{fill:none;stroke:var(--wrong);stroke-width:2;stroke-linejoin:round}
.resid{stroke:var(--wrong);stroke-width:1;opacity:.55}

/* ---------- confusion matrix ---------- */
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:7px;margin:0 0 16px;max-width:430px}
.cmh{font:500 11px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-faint);display:grid;place-items:center;padding:5px}
.cmc{border-radius:8px;padding:13px 10px;text-align:center;font:600 22px/1 var(--mono);
  font-variant-numeric:tabular-nums}
.cmc span{display:block;font:400 10.5px/1.3 var(--sans);margin-top:5px;opacity:.8}
.cmc.tp{background:var(--right-tint);color:var(--right)}
.cmc.tn{background:var(--sunk);color:var(--ink-soft)}
.cmc.fp,.cmc.fn{background:var(--wrong-tint);color:var(--wrong)}
.mbar{display:flex;align-items:center;gap:10px}
.mbar i{height:9px;border-radius:5px;display:block;min-width:2px}
.mbar i.neu{background:var(--ink-faint)} .mbar i.pre{background:var(--accent)}
.mbar i.rec{background:var(--right)} .mbar i.f1{background:var(--ml)}
.mbar b{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- scheduling and tours (week 11) ---------- */
.gantt{display:grid;gap:6px;margin:4px 0 0}
.grow{display:grid;grid-template-columns:30px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.gbar{display:flex;height:28px;background:var(--sunk);border-radius:5px;overflow:hidden}
.gjob{display:grid;place-items:center;font:500 12px/1 var(--mono);background:var(--accent-tint);
  color:var(--accent-ink);border-right:2px solid var(--surface);min-width:0;overflow:hidden}
.gjob.last{background:var(--accent);color:var(--surface)}
.steps{margin:12px 0 0;color:var(--ink-soft)}
.steps summary{cursor:pointer;font:500 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-ink)}
.steps ol{margin:10px 0 0;padding-left:22px}
.steps li{margin:0 0 4px;font:400 12.5px/1.55 var(--mono);overflow-wrap:anywhere}
.tspplot{max-width:360px}
.treeline{stroke:var(--ink-faint);stroke-opacity:.35;stroke-width:8;stroke-linecap:round}
.matchline{stroke:var(--wrong);stroke-width:2.5;stroke-dasharray:6 4}
.tourline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.city circle{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.5}

{n:1,uke:"uke35",src:"Ch.9 slides 2–11",topic:"Strings, and matching them the obvious way",
 blurb:"What the words mean, the slowest possible search, and how to count exactly what it costs.",
 concepts:[
  {t:"Prefix, suffix, substring — and why the empty string counts",cite:"slide 4 · slide 6",
   plain:"A prefix is a chunk from the start. A suffix is a chunk from the end. A substring is a chunk from anywhere. The tricky part is that the empty string counts as all three, and so does the whole word.",
   body:`<p>Take the word <code>abc</code>.</p>
     <p>Its <strong>prefixes</strong> are the pieces you get by chopping off the end:
     <code>abc</code>, <code>ab</code>, <code>a</code> — and <code>""</code>, the empty string,

     <p>A <strong>substring</strong> is any run of consecutive characters. Pick a start
     position and an end position, and you get one. That's why the count is
     <code>m(m+1)/2</code> — the number of ways to pick a start and an end with the start not
     after the end — plus one more for the empty string, which no start/end pair produces.</p>
     <p><strong>Why the empty string matters.</strong> It looks like a technicality but it is not.
     Slide 4 says outright that the null string is a prefix and a suffix of every string, and if
     you forget it, every count in the chapter comes out one short. It also shows up as a real
     answer later: the longest common subsequence of two strings with nothing in common is the
     empty string, not "no answer".</p>`,
   code:`m = 3, the word "abc"\n\nprefixes    ""  a   ab  abc          4  = m+1\nsuffixes    ""  c   bc  abc          4  = m+1\nsubstrings  ""  a b c  ab bc  abc   7  = m(m+1)/2 + 1`,
   demo:"strings",
   cp:{q:"How many substrings of a length-m string are neither a prefix nor a suffix?",
       a:`<code>m(m+1)/2 - 2m + 1</code>. Start with all the substrings, subtract the prefixes,
          subtract the suffixes — but you have now subtracted twice the two things that are
          <em>both</em> a prefix and a suffix (the empty string and the whole string), so add
          those two back.`}},

  {t:"Brute force: slide the pattern along and check",cite:"slide 8 · slide 9",
   plain:"Line the pattern up at the very start of the text and compare letter by letter. If it doesn't fit, shift the pattern one place right and try again. Keep going until it fits or you run out of room.",
   body:`<p>This is the way you would do it by hand, and it is worth being clear that it is
     genuinely correct — it just does a lot of unnecessary work.</p>
     <p>Two details in slide 9's pseudocode catch people out.</p>
     <p><strong>The loop runs to <code>n - m</code>, and that value is included.</strong> If the
     text has 10 characters and the pattern has 3, the last place the pattern can sit is starting
     at index 7 — because it occupies 7, 8 and 9. So there are <code>n - m + 1</code> positions
     to try, not <code>n - m</code>. Writing <code>range(n-m)</code> in Python quietly misses a
     match sitting right at the end of the text, and that bug passes almost every test you would
     write by hand.</p>
     <p><strong>It throws away everything it learns.</strong> Suppose the pattern matches five
     characters and then fails on the sixth. Brute force shifts one position right and starts
     again from scratch — even though those five characters told it a great deal about what the
     text contains. Weeks 2 and 3 are two different ways of not wasting that.</p>`,
   code:`for i = 0 to n - m do        <- note: n-m is included\n    j = 0\n    while (j < m and T[i+j] = P[j]) do\n        j++\n    if j = m then return i   <- all m characters matched\nreturn "no substring"`,
   demo:"match",
   cp:{q:"Why does the loop stop at i = n − m rather than i = n, and what breaks if you stop at n − m − 1?",
       a:`Beyond <code>n-m</code> the pattern would hang off the end of the text — there aren't
          <code>m</code> characters left to compare against. Stopping one earlier, at
          <code>n-m-1</code>, skips the last legal position, so a match flush against the end of
          the text is never found.`}},

  {t:"Counting comparisons, exactly",cite:"Compulsory 1, problem 1",
   plain:"A 'comparison' means one moment where you check whether a text character equals a pattern character. Running out of pattern isn't a comparison. Get this definition right or your count will be off.",
   body:`<p>The compulsory exercise is marked on a number, so the definition has to be precise.
     <strong>One comparison is one evaluation of <code>T[i+j] = P[j]</code></strong> — one moment
     where you hold a text character next to a pattern character and ask if they are the same.</p>
     <p>The loop condition is <code>j &lt; m and T[i+j] = P[j]</code>. The first half,
     <code>j &lt; m</code>, is a check about how far along the pattern you are — it is not a
     character comparison and does not count.</p>
     <p>In practice, at each position you count <strong>one for every character that matched, plus
     one for the character that failed</strong>, if one did. If the whole pattern matched, there
     was no failure, so you count exactly <code>m</code>.</p>
     <p>Run the demo below on the compulsory instance and watch the counter. The answer is
     <strong>24 comparisons, matching at index 7</strong> — and it is worth keeping, because
     Boyer–Moore does the same job in 10 and KMP in 17. Comparing those three numbers is the
     whole point of the exercise.</p>`,
   demo:"match",
   cp:{q:"Brute force on T = aaabaadaabaaa, P = aabaaa: how many comparisons, and where does it match?",
       a:`<strong>24 comparisons</strong>, match at <strong>index 7</strong>. Keep the number —
          Boyer–Moore needs 10 on the same input and KMP 17.`}},

  {t:"A border: a prefix that is also a suffix",cite:"Compulsory 1, problem 4",
   plain:"Some words start and end with the same chunk. 'aaabbaaa' starts with 'aaa' and ends with 'aaa'. Those overlapping chunks are called borders, and they turn out to be the key to the fastest search algorithm.",
   body:`<p>A <strong>border</strong> is a piece that appears at both ends of a string. Formally: a
     nonempty <em>proper</em> prefix that is also a suffix. "Proper" means the whole string does
     not count — a string trivially starts and ends with itself, and that fact is useless.</p>
     <p>Take <code>aaabbaaa</code>. Does it start and end with <code>a</code>? Yes. With
     <code>aa</code>? Yes. With <code>aaa</code>? Yes. With <code>aaab</code>? It starts with
     that, but ends with <code>baaa</code> — no. So there are three borders, and the answer to
     Compulsory problem 4 is <strong>3</strong>.</p>
     <p><strong>Why you should care.</strong> Suppose you are searching for
     <code>aaabbaaa</code> in some text, you have matched all eight characters, and then the
     next thing fails. You know the last three characters of what you matched were
     <code>aaa</code> — and <code>aaa</code> is also how the pattern <em>starts</em>. So you can
     keep those three and carry on, instead of throwing everything away.</p>
     <p>That is exactly what KMP does in week 3. You are already doing week 3's work.</p>`,
   demo:"borders",
   cp:{q:"What is a border, and which algorithm is built entirely out of them?",
       a:`A nonempty proper prefix that is also a suffix. <strong>Knuth–Morris–Pratt</strong> —
          its failure function <code>f(j)</code> is the length of the longest border of the
          pattern's first <code>j+1</code> characters.`}}]},

{n:2,uke:"uke35",src:"Ch.9 slides 12–19",topic:"Boyer–Moore",
 blurb:"Compare backwards, and a single wrong letter can rule out a dozen positions at once.",
 concepts:[
  {t:"Compare from the back, not the front",cite:"slide 12 · slide 13",
   plain:"Line the pattern up as usual, but start comparing at the pattern's LAST character and work backwards. It sounds arbitrary. It's what lets you skip huge chunks of text.",
   body:`<p>Slide 12 admits this "might come as a surprise": Boyer–Moore usually does not look at
     every character of the text at all. How can you be sure a pattern isn't somewhere without
     looking there?</p>
     <p>Here is the intuition. You are searching for <code>algorithm</code> (10 letters). Line it
     up and look at the 10th text character. Suppose it is <code>x</code>. There is no
     <code>x</code> anywhere in <code>algorithm</code> — so that <code>x</code> cannot be part of
     any match. Every position that overlaps it is dead. You can jump the pattern <em>completely
     past</em> it in one move, skipping ten positions without ever looking at the nine characters
     you jumped over.</p>
     <p>That only works because you looked at the <strong>far end</strong> first. Had you started
     at the front and compared forwards, a mismatch at the first character would only rule out
     the one position you were testing.</p>
     <p>The slides call this the <strong>looking-glass heuristic</strong> — comparing backwards —
     and the jump it enables the <strong>character-jump heuristic</strong>.</p>`,
   demo:"match",
   cp:{q:"Why does comparing backwards allow bigger jumps than comparing forwards?",
       a:`A mismatch at the end of the pattern rules out every alignment that overlaps that text
          character, so you can skip up to <code>m</code> positions at once. A mismatch at the
          front only tells you the current alignment is wrong.`}},

  {t:"last(c): where does this letter last appear in the pattern?",cite:"slide 14",
   plain:"Before searching, make a small lookup table: for each letter, the position of its LAST appearance in the pattern, or −1 if it doesn't appear at all. That table tells you how far to jump.",
   body:`<p>When a text character <code>c</code> causes a mismatch, you want to slide the pattern
     so that <code>c</code> lines up with a matching character. Which one? The
     <strong>rightmost</strong> occurrence of <code>c</code> in the pattern — because using any
     earlier one would slide the pattern further than necessary and might skip past a real
     match.</p>
     <p>So <code>last(c)</code> is the index of the last occurrence of <code>c</code> in the
     pattern, or <code>-1</code> if <code>c</code> is not there at all. The <code>-1</code> is
     what produces the "jump completely past it" behaviour.</p>
     <p><strong>The trap:</strong> for <code>P = "there"</code>, <code>last('e')</code> is
     <strong>4</strong>, not 2. There is an <code>e</code> at index 2 and another at index 4;
     rightmost wins.</p>
     <p>In Python this is a one-liner, and it is right by accident in a satisfying way: build a
     dict from <code>enumerate(P)</code> and later keys overwrite earlier ones, which is exactly
     "rightmost wins".</p>`,
   code:`P = "there"        index:  0 1 2 3 4\n                          t h e r e\n\nlast('t') = 0\nlast('h') = 1\nlast('e') = 4     <- the second one, not index 2\nlast('r') = 3\nlast('z') = -1    <- not in the pattern at all\n\n{c: i for i, c in enumerate(P)}`,
   demo:"last",
   cp:{q:"For P = 'there', what is last('e') and why is it not 2?",
       a:`<strong>4</strong>. The table records the <em>rightmost</em> occurrence, and
          <code>"there"</code> has an <code>e</code> at index 4 as well as index 2. Using the
          earlier one would slide the pattern too far and could skip a match.`}},

  {t:"The jump formula, and the one term that stops it breaking",cite:"slide 15",
   plain:"The formula for how far to jump has a min() in it. Without that min(), the pattern can slide BACKWARDS and the algorithm loops forever. That one term is the whole safety argument.",
   body:`<p>The jump is <code>i ← i + m − min(j, 1 + last(T[i]))</code>. Let's take it apart.</p>
     <p><strong>Case 1 — the character isn't in the pattern.</strong> Then
     <code>last(T[i]) = -1</code>, so <code>1 + last = 0</code>, so <code>min(j, 0) = 0</code>,
     and the jump is <code>i + m</code>: the full pattern length. That is the "slide completely
     past it" case.</p>
     <p><strong>Case 2 — the character is in the pattern, to the left of where we are.</strong>
     Then <code>1 + last(T[i])</code> is smaller than <code>j</code>, so the
     <code>min</code> picks it, and the shift lines that occurrence up under
     <code>T[i]</code>. Sensible.</p>
     <p><strong>Case 3 — the character is in the pattern, but to the right of where we are.</strong>
     Now <code>1 + last(T[i])</code> is <em>bigger</em> than <code>j</code>. Lining it up would
     mean dragging the pattern <strong>left</strong>, back over ground you already covered. The
     <code>min</code> catches this and uses <code>j</code> instead, which guarantees the shift is
     at least 1 to the right.</p>
     <p>So: without the <code>min</code>, case 3 makes the pattern move backwards and the loop
     never terminates. That single term is the entire correctness argument, and it is a
     favourite exam question.</p>`,
   cp:{q:"What goes wrong if you drop the min(j, …) from the jump step?",
       a:`In the case where the mismatched character occurs in the pattern to the <em>right</em>
          of the current position, the computed shift becomes negative and the pattern slides
          left. The algorithm re-examines positions it already tried and can loop forever. The
          <code>min</code> forces a shift of at least one to the right.`}},

  {t:"Worse in theory, much faster in practice",cite:"slide 19",
   plain:"In the worst case Boyer–Moore is no better than brute force. On ordinary text it does about a quarter of one comparison per character, which is roughly four times better. Both facts are true and neither is the whole story.",
   body:`<p>The worst case is <code>O(mn)</code> — exactly brute force's bound. The witness is
     <code>T = "aaaa…a"</code> with <code>P = "baaa…a"</code>: every alignment matches all the
     <code>a</code>s from the back before failing on the leading <code>b</code>, and the jump is
     only 1 each time.</p>
     <p>So why use it? Because that worst case is contrived and real text is not. Slide 19 gives
     the measured figure: English text with a five-character pattern needs about
     <strong>0.24 comparisons per text character</strong>. Brute force does slightly more than
     one. You are looking at roughly a quarter of the work.</p>
     <p><strong>The caveat on the same slide matters too.</strong> It is "not so good for binary
     strings or very short patterns". With a two-symbol alphabet, essentially every text
     character appears somewhere in the pattern, so <code>last</code> is almost never
     <code>-1</code>, the jumps collapse to about 1, and you have paid for a lookup table that
     buys nothing.</p>
     <p>The tutorial reproduces the 0.24 figure on a Norwegian passage — it comes out between
     0.21 and 0.25, which is Compulsory problem 2b done as a measurement rather than an
     assertion.</p>`,
   demo:"match",
   cp:{q:"Slide 19 says 0.24 comparisons per character on English text. Why does a binary alphabet ruin that?",
       a:`With only two symbols, nearly every text character occurs somewhere in the pattern, so
          <code>last</code> almost never returns −1 and the character-jump heuristic shifts by
          roughly one position each time — no better than brute force, but with extra bookkeeping.`}}]},

{n:3,uke:"uke35",src:"Ch.9 slides 20–30",topic:"Knuth–Morris–Pratt",
 blurb:"Never re-read a text character. The slides call it optimal, and it is.",
 concepts:[
  {t:"The idea: never look at the same text character twice",cite:"slide 20",
   plain:"Brute force forgets what it just learned. KMP remembers, by asking a question about the pattern alone: 'given that I matched this much and then failed, how much of it can I keep?'",
   body:`<p>Picture searching for <code>abcabd</code>. You match <code>abcab</code> — five
     characters — and then the sixth fails.</p>
     <p>Brute force shifts one right and starts over, re-reading text it has already seen. But
     look at what you know: the last two characters you matched were <code>ab</code>, and the
     pattern <em>starts</em> with <code>ab</code>. So instead of restarting, you can slide the
     pattern along until its opening <code>ab</code> sits under that <code>ab</code>, and carry
     on from the third pattern character — without moving backwards in the text at all.</p>
     <p>Notice what the question depended on: <strong>only the pattern</strong>. "Where does a
     prefix of the pattern also appear as a suffix of what I've matched?" You can answer that
     before you ever see the text — which is why KMP preprocesses the pattern once and then
     never backtracks.</p>
     <p>The result is <code>O(m + n)</code>, and slide 20 calls it <strong>optimal</strong>. Not
     "usually good" — optimal, because you cannot answer the question without reading both strings
     once.</p>`,
   demo:"match",
   cp:{q:"After a partial match fails, what question does KMP ask, and why can it be answered in advance?",
       a:`"How much of what I just matched is also a prefix of the pattern?" It depends only on
          the pattern, not the text, so it can be computed once up front — that's the failure
          function.`}},

  {t:"The failure function is a table of borders",cite:"slide 21 · slide 22",
   plain:"f(j) is a number for each position in the pattern: the length of the longest chunk that appears both at the start of the pattern and at the end of the part you've matched so far. That's the 'border' from week 1.",
   body:`<p>Slide 21's wording is careful: <code>f(j)</code> is the length of the longest prefix of
     <code>P</code> that is a suffix of <code>P[1..j]</code>. Notice it says
     <code>P[1..j]</code>, starting at <strong>1</strong>, not 0 — that is what forces the prefix
     to be a <em>proper</em> one, otherwise the answer would always be "the whole thing".</p>
     <p>In week 1's language: <code>f(j)</code> is the length of the longest <strong>border</strong>
     of the pattern's first <code>j+1</code> characters.</p>
     <p>Work through <code>abacab</code> by hand:</p>
     <ul>
       <li><code>a</code> — no proper border. <code>f(0) = 0</code>, always.</li>
       <li><code>ab</code> — starts with <code>a</code>, ends with <code>b</code>. 0.</li>
       <li><code>aba</code> — starts and ends with <code>a</code>. <strong>1</strong>.</li>
       <li><code>abac</code> — ends with <code>c</code>, pattern starts with <code>a</code>. 0.</li>
       <li><code>abaca</code> — ends with <code>a</code>. <strong>1</strong>.</li>
       <li><code>abacab</code> — ends with <code>ab</code>, starts with <code>ab</code>.
           <strong>2</strong>.</li>
     </ul>
     <p>That last one is the payoff: fail after matching all of <code>abacab</code> and you keep
     the <code>ab</code>, restarting at <code>j = 2</code> rather than 0.</p>`,
   code:`P = "abacab"\n\nj     0  1  2  3  4  5\nP[j]  a  b  a  c  a  b\nf(j)  0  0  1  0  1  2`,
   demo:"failure",
   cp:{q:"For P = 'abacab', what is f(5), and what does it let you do on a mismatch?",
       a:`<strong>2</strong> — <code>"abacab"</code>'s longest border is <code>"ab"</code>. Having
          matched all six characters and failed on the next, you keep the trailing
          <code>ab</code> and resume at <code>j = 2</code>, without re-reading any text.`}},

  {t:"j ← f(j−1): the line everyone rewrites and breaks",cite:"slide 28",
   plain:"When building the table, if a border can't be extended you don't give up — you fall back to the border OF THAT BORDER and try again. That fallback line is the whole algorithm, and 'simplifying' it always breaks it.",
   body:`<p>The construction matches the pattern against <em>itself</em>. You walk two pointers:
     <code>i</code> is where you are in the pattern, <code>j</code> is how long a border you are
     currently hoping for.</p>
     <p>When <code>P[i]</code> and <code>P[j]</code> agree, the border grows by one and both
     pointers advance. When they disagree, you cannot simply reset <code>j</code> to 0 — that
     would throw away real information. The right move is to try the next-longest candidate,
     which is <strong>the longest border of the border you were just trying</strong>. And you have
     already computed that: it is <code>f(j-1)</code>.</p>
     <p><strong>Critically, that branch does not advance <code>i</code>.</strong> You have not
     finished deciding <code>f(i)</code> yet — you are still trying candidates for it. Advancing
     <code>i</code> there skips the position entirely and silently produces a wrong table, which
     then makes the search wrong in ways that are very hard to debug.</p>
     <p>Write it exactly as slide 28 gives it. Every "obvious simplification" of this loop is
     wrong in some case.</p>`,
   code:`i ← 1 ;  j ← 0 ;  f(0) ← 0\nwhile i < m do\n    if P[j] = P[i] then\n        f(i) ← j + 1 ;  i++ ;  j++\n    else if j > 0\n        j ← f(j-1)          <- fall back; do NOT touch i\n    else\n        f(i) ← 0 ;  i++`,
   demo:"failure",
   cp:{q:"Why does the j ← f(j−1) branch leave i unchanged?",
       a:`Because <code>f(i)</code> has not been decided yet — you are still testing shorter
          candidate borders for that same position. Advancing <code>i</code> would skip the
          position and leave a wrong entry in the table.`}},

  {t:"Return i − m + 1, not i",cite:"slide 23",
   plain:"When KMP finds a match, the index it's holding points at the LAST character of the match. The answer you want is the first, so subtract m−1.",
   body:`<p>Small point, constant source of bugs. KMP walks forward through the text and declares
     a match when it has just consumed the pattern's final character. At that moment
     <code>i</code> is sitting on the <em>last</em> character of the occurrence.</p>
     <p>The question asked for the <em>starting</em> index, so step back <code>m-1</code> places:
     <code>i - m + 1</code>.</p>
     <p>Sanity check it on the smallest possible case. Pattern of length 1, matching at text index
     3: <code>i = 3</code>, <code>m = 1</code>, so <code>3 - 1 + 1 = 3</code>. Correct.</p>`,
   cp:{q:"KMP reports a match. Why is the answer i − m + 1?",
       a:`<code>i</code> indexes the last matched character, not the first. Stepping back
          <code>m-1</code> positions lands on where the occurrence begins.`}},

  {t:"Why it's linear: the k = i − j argument",cite:"slide 27",
   plain:"Define k = i − j, which is roughly 'where the pattern currently starts in the text'. Every single step of the loop pushes either i or k forward by at least one. Neither can pass n. So there are at most 2n steps.",
   body:`<p>This proof is short enough to reproduce in an exam and it is worth being able to.</p>
     <p>Let <code>k = i - j</code>. Since <code>i</code> is the text position and <code>j</code>
     is how far into the pattern you are, <code>k</code> is where the current alignment of the
     pattern begins. It never exceeds <code>n</code>.</p>
     <p>Now check every branch of the loop:</p>
     <ul>
       <li><strong>Characters match.</strong> Both <code>i</code> and <code>j</code> go up by 1,
         so <code>k = i - j</code> is unchanged — but <code>i</code> increased.</li>
       <li><strong>Mismatch with <code>j &gt; 0</code>.</strong> <code>i</code> stays put and
         <code>j</code> drops, so <code>k</code> increases.</li>
       <li><strong>Mismatch with <code>j = 0</code>.</strong> <code>i</code> goes up, <code>j</code>
         stays at 0, so both <code>i</code> and <code>k</code> increase.</li>
     </ul>
     <p>In every case, <strong>either <code>i</code> or <code>k</code> increases by at least
     one</strong>. Both are capped at <code>n</code>, so the loop cannot run more than
     <code>2n</code> times. Add the failure function's own <code>O(m)</code> and you have
     <code>O(m + n)</code>.</p>`,
   cp:{q:"Reproduce the argument that KMP performs at most 2n loop iterations.",
       a:`Let <code>k = i − j</code>, bounded by <code>n</code>. On a match, <code>i</code> grows
          and <code>k</code> is unchanged; on a mismatch with <code>j&gt;0</code>, <code>i</code>
          is unchanged and <code>k</code> grows; on a mismatch with <code>j=0</code>, both grow.
          So each iteration advances <code>i</code> or <code>k</code>, and each is capped at
          <code>n</code> — at most <code>2n</code> iterations.`}},

  {t:"Three algorithms, one instance — and the ranking surprises people",cite:"Compulsory 1, problems 1–3",
   plain:"On the compulsory exercise's own input: brute force 24 comparisons, Boyer–Moore 10, KMP 17. The 'optimal' one comes second. That's not a contradiction, and knowing why is the exam answer.",
   body:`<p>All three find the match at index 7. The comparison counts differ a lot.</p>
     <p><strong>Why doesn't the optimal algorithm win?</strong> Because "optimal" is a statement
     about the <em>worst case</em>, not about any particular input. KMP guarantees
     <code>O(m+n)</code> on every input, including adversarial ones. Boyer–Moore guarantees
     nothing — its worst case is as bad as brute force — but on ordinary inputs it skips text
     characters entirely, which KMP never does.</p>
     <p>So the honest answer to "which should I use" is: <strong>it depends on the
     alphabet</strong>. Moderate-to-large alphabet with a longish pattern — natural language,
     DNA with a decent pattern length — Boyer–Moore usually wins. Tiny alphabet, very short
     pattern, or a situation where you need a guarantee rather than an average — KMP.</p>
     <p>Run all three in the demo on the compulsory input and watch the counters diverge.</p>`,
   code:`T = "aaabaadaabaaa"    P = "aabaaa"\n\nbrute force   24 comparisons   match at 7\nBoyer–Moore   10               match at 7\nKMP           17               match at 7`,
   demo:"match",
   cp:{q:"KMP is optimal and Boyer–Moore is not, yet BM wins here. Explain, and say when you would pick each.",
       a:`Optimality is a worst-case guarantee, not a prediction for a given input. KMP is
          <code>O(m+n)</code> always; Boyer–Moore has no such bound but skips text characters, so
          it usually wins on natural text with a moderate alphabet. Pick BM for large alphabets
          and longer patterns; pick KMP for small alphabets, short patterns, or when you need the
          guarantee.`}}]},

{n:4,uke:"uke35",src:"Ch.9 slides 31–46",topic:"Tries, standard and compressed",
 blurb:"A tree of shared prefixes. Then a trick that stops it wasting nodes on long words.",
 concepts:[
  {t:"What a trie actually is",cite:"slide 31",
   plain:"A tree where each edge is labelled with a letter, and spelling out a path from the root gives you a stored word. Words that start the same way share the same branches.",
   body:`<p>Store <code>car</code>, <code>cat</code> and <code>dog</code>. All three start at a
     shared root. <code>car</code> and <code>cat</code> both begin <code>c → a</code>, so they
     share those two edges and only split at the third letter. <code>dog</code> shares nothing
     and hangs off the root separately.</p>
     <p>That sharing is the whole point. Looking up a word costs only as long as the word is —
     the size of the dictionary does not enter into it. Ten words or ten million, checking
     <code>cat</code> is three steps.</p>
     <p>This is also why it is the natural structure for <strong>autocomplete</strong>: walk down
     to where the typed prefix ends, and everything below that point is a completion. You never
     touch the rest of the tree.</p>`,
   demo:"trie",
   cp:{q:"Why does looking a word up in a trie not get slower as you add more words?",
       a:`Because the search follows one edge per character of the query word. The path length is
          the word's length; the number of other words stored changes how bushy the tree is, not
          how deep you walk.`}},

  {t:"The prefix problem, and the $ that fixes it",cite:"slide 31 · slide 32",
   plain:"If you store both 'car' and 'card', then 'car' ends in the middle of a branch and you can't tell 'this is a word' from 'this is on the way to a word'. The fix is to stick a terminator on the end of every word.",
   body:`<p>Slide 31 quietly requires that <strong>no stored string is a prefix of another</strong>.
     It is easy to skim past, but drop it and the structure genuinely breaks.</p>
     <p>Store <code>car</code> and <code>card</code>. Walk down <code>c → a → r</code> and you are
     standing on a node that has a child (<code>d</code>). Is <code>car</code> a stored word, or
     merely a stop on the way to <code>card</code>? The tree cannot tell you.</p>
     <p>Slide 32's fix, which it calls "no limitation": append a symbol that never appears in the
     alphabet. Store <code>car$</code> and <code>card$</code>. Now <code>car$</code> ends at a
     leaf and <code>card$</code> ends at a different leaf, and the question is answered by
     construction.</p>
     <p><strong>The payoff:</strong> external nodes are now exactly the words. Count the leaves
     and you have counted the dictionary. Slide 36's theorem — that a trie has <code>s</code>
     external nodes for <code>s</code> strings — is only true because of this.</p>`,
   demo:"trie",
   cp:{q:"Why can't a standard trie store 'car' and 'card' as given, and what is the standard repair?",
       a:`<code>car</code> would end at an internal node, so "is a word" and "is a prefix of a
          word" become indistinguishable. Append a terminator <code>$</code> to every string, so
          every word ends at its own external node.`}},

  {t:"Compressed tries: stop paying for chains",cite:"slide 40 · slide 41 · slide 46",
   plain:"A word like 'ccccc' costs five nodes, each with exactly one child, each telling you nothing. Squash those chains into a single edge labelled with the whole substring.",
   body:`<p>Slide 40 names the problem: tries waste space on chains of single-child nodes. If
     nothing else in the dictionary shares a prefix with <code>ccccc</code>, then storing it
     creates five nodes in a row that each say "keep going, no choices here".</p>
     <p>A <strong>compressed trie</strong> — also called a Patricia trie, for <em>Practical
     Algorithm To Retrieve Information Coded In Alphanumeric</em> — collapses each chain into
     one edge labelled with the whole substring. The defining property afterwards is that
     <strong>every internal node has at least two children</strong>: if it had one, it would have
     been collapsed.</p>
     <p><strong>Why this is a big deal.</strong> Slide 46: the node count drops from
     <code>O(n)</code>, where <code>n</code> is the total <em>length</em> of all the strings, to
     <code>O(s)</code>, where <code>s</code> is just the <em>number</em> of strings. Size stops
     depending on how long the words are. Three 50-character strings that share nothing compress
     to exactly the same shape as <code>a</code>, <code>b</code>, <code>c</code>.</p>
     <p>On the compulsory exercise's 8-string set: <strong>35 nodes standard, 13 compressed</strong>,
     both with 8 leaves. Toggle it in the demo and watch the chains collapse.</p>`,
   demo:"trie",
   cp:{q:"Compulsory 5 and 6: how many nodes in the standard and compressed tries for that 8-string set, and what stays the same?",
       a:`<strong>35</strong> standard and <strong>13</strong> compressed. Both have
          <strong>8 external nodes</strong> — one per string — because compression removes
          internal chains, never leaves.`}}]},

{n:5,uke:"uke35",src:"Ch.9 slides 47–58",topic:"Suffix tries and inverted files",
 blurb:"Preprocess the text once, and searching stops caring how long the text is.",
 concepts:[
  {t:"Every substring is a prefix of some suffix",cite:"slide 52",
   plain:"That one sentence is the whole idea. If you store every suffix of a text in a trie, then searching for any substring becomes just walking down from the root.",
   body:`<p>Take <code>banana</code>. Its suffixes are <code>banana</code>, <code>anana</code>,
     <code>nana</code>, <code>ana</code>, <code>na</code>, <code>a</code>.</p>
     <p>Now ask: is <code>nan</code> in <code>banana</code>? It appears starting at index 2. Look
     at the suffix that <em>begins</em> at index 2: <code>nana</code>. And <code>nan</code> is a
     prefix of <code>nana</code>.</p>
     <p>That is not a coincidence — it is always true. Any substring starts somewhere, and the
     suffix beginning at that same place starts with it. So <strong>every substring of X is a
     prefix of some suffix of X</strong>, and if you have all the suffixes in a trie, substring
     search is just prefix search.</p>
     <p>One consequence trips people up: you do <strong>not</strong> need to reach a leaf. Stopping
     halfway down a branch means "this is a prefix of a stored suffix", which is exactly the
     condition you were testing. Stopping halfway is a <em>success</em>.</p>
     <p>(The <code>$</code> is needed again, for the same reason as week 4: <code>a</code> is a
     prefix of <code>ana</code>, so without a terminator the suffixes violate the trie condition.)</p>`,
   demo:"suffix",
   cp:{q:"Why does tracing a path — without reaching a leaf — prove P is a substring?",
       a:`Every substring is a prefix of some suffix, and the trie stores all the suffixes. A
          traceable path means <code>P</code> prefixes at least one stored suffix, which is an
          occurrence of <code>P</code> in the text.`}},

  {t:"The text length vanishes from the query",cite:"slide 53 · slide 54",
   plain:"Once built, answering 'is this pattern in the text' takes time proportional to the PATTERN only. A 500 MB text answers as fast as a 500-byte one. You paid for that up front.",
   body:`<p>Compare the three things you now know.</p>
     <ul>
       <li><strong>Brute force</strong> — <code>O(mn)</code>, no preprocessing.</li>
       <li><strong>KMP</strong> — <code>O(m + n)</code>, optimal for one search, but it still
         reads the whole text every time you search.</li>
       <li><strong>Suffix trie</strong> — <code>O(dm)</code> per query. <strong><code>n</code> is
         not in that expression at all.</strong></li>
     </ul>
     <p>The catch is construction: naively <code>O(dn²)</code>, because the suffixes have total
     length about <code>n²/2</code>. Slide 51 notes a linear-time algorithm exists and is "fairly
     complex" — you are expected to know it exists, not to write it.</p>
     <p>So the decision rule, which slide 53 states directly: this is for <em>a series of queries
     on a fixed text</em>. Search a text once, use KMP. Search the same text ten million times,
     build the trie and let every query be nearly free.</p>`,
   demo:"suffix",
   cp:{q:"One 500 MB text, ten patterns. Then ten million patterns. Which structure each time, and what changed?",
       a:`Ten patterns: KMP — building the suffix trie costs more than the searches would save.
          Ten million: the suffix trie — you pay <code>O(n)</code> construction once and then each
          query costs only <code>O(m)</code>, with the text size absent.`}},

  {t:"Inverted files: the same idea, scaled to documents",cite:"slides 56–58",
   plain:"A search engine doesn't scan the web when you type. It has a precomputed table: for each word, the list of pages containing it. Looking up two words means fetching two lists and intersecting them.",
   body:`<p>An <strong>inverted index</strong> stores pairs <code>(w, L)</code>: a word, and its
     <strong>occurrence list</strong> — the documents containing it. "Inverted" because the
     natural direction is document → words, and this is the other way round.</p>
     <p>Slide 57 describes the real implementation, and it is this fortnight's two structures
     working together:</p>
     <ul>
       <li>a <strong>compressed trie</strong> of the index terms, held <strong>in memory</strong>
         — small, because slide 42 said its size depends on the number of terms, not their
         length;</li>
       <li>the <strong>occurrence lists on disk</strong> — huge.</li>
     </ul>
     <p>Walking the trie in memory tells you exactly where on disk to read. You touch the disk
     once, for the answer, instead of scanning.</p>
     <p>Multi-word queries fetch one list per word and return the <strong>intersection</strong>.
     Then you rank the results by relevance — which slide 58 calls "an important area" and leaves
     entirely alone. That part is what search companies are actually built on.</p>`,
   demo:"inverted",
   cp:{q:"Why is the term index a compressed trie in memory while the occurrence lists live on disk?",
       a:`Slide 42: a compressed trie's size is proportional to the number of terms rather than
          their total length, so the index fits in RAM. The occurrence lists are far bigger, so
          you walk the in-memory trie to learn where to read and touch the disk once.`}}]},

{n:6,uke:"uke35",src:"Ch.9 slides 59–66",topic:"Huffman coding",
 blurb:"Spend fewer bits on common letters. Provably the best you can do per character.",
 concepts:[
  {t:"Why variable-length codes need a rule",cite:"slide 60 · slide 61",
   plain:"ASCII gives every character the same number of bits, which is wasteful when some letters are far more common. Give common letters short codes — but then you need a rule so the receiver can tell where one code ends and the next begins.",
   body:`<p>ASCII spends 7 bits on every character, the same for <code>e</code> as for
     <code>v</code>, though English has vastly more <code>e</code>s. The obvious fix is short
     codes for common characters and long ones for rare characters.</p>
     <p>But now decoding is a problem. Suppose <code>a = 0</code> and <code>b = 01</code>. You
     receive <code>01</code>. Is that <code>b</code>, or is it <code>a</code> followed by the
     start of something? You cannot tell.</p>
     <p>Slide 61's answer is the <strong>prefix code</strong> condition: <em>no code word is a
     prefix of another code word</em>. With that rule, as soon as the bits you have read form a
     valid code word, you know it must be that character — no longer code word could start the
     same way.</p>
     <p>And here is the neat part: that is <em>exactly</em> the condition slide 31 needed for
     tries. It is met the same way — put every character at a <strong>leaf</strong> of a binary
     tree and read its code off the path. A leaf's path can never be a prefix of another leaf's
     path.</p>`,
   cp:{q:"What is a prefix code, and why must Huffman produce one?",
       a:`A set of code words in which none is a prefix of another. Huffman puts every character
          at a leaf of a binary tree and reads code words off root-to-leaf paths, so no code word
          can prefix another — which is what makes left-to-right decoding unambiguous.`}},

  {t:"The algorithm: keep merging the two smallest",cite:"slide 62 · slide 63",
   plain:"Start with one tiny tree per character, holding its frequency. Repeatedly take the two trees with the smallest frequencies and join them under a new parent. Stop when one tree is left. Left edges are 0, right edges are 1.",
   body:`<p>That is genuinely the whole algorithm. It is greedy: at each step it makes the locally
     cheapest choice, and remarkably that turns out to be globally optimal.</p>
     <p><strong>Why merging the two smallest is right.</strong> Merging two trees pushes both of
     them one level deeper, adding one bit to every character underneath. You want that cost paid
     by the characters that occur least often — so you merge the two rarest things available. The
     two rarest characters get merged first, sink deepest, and end up with the longest codes.
     Exactly what you wanted.</p>
     <p>With a heap, each merge is <code>O(log d)</code> and there are <code>d</code> of them, so
     the whole thing is <code>O(n + d log d)</code> — the <code>n</code> being the single pass to
     count frequencies.</p>`,
   demo:"huffman",
   cp:{q:"Which two trees does Huffman merge at each step, and what does that force about rare characters?",
       a:`The two with the smallest frequencies. Merging adds a bit to everything beneath, so
          merging the rarest first means they sink deepest and receive the longest code words —
          which is precisely the goal.`}},

  {t:"The tree isn't unique, but the total length is",cite:"ties",
   plain:"If two frequencies tie, the algorithm doesn't say which to pick, so different people get different code words. That's fine — every choice is optimal, so the total number of bits always comes out the same.",
   body:`<p>This confuses people, so it is worth stating plainly. When two subtrees have equal
     frequency, slide 63 does not say which to take first. Take them in a different order and you
     get <strong>different code words</strong> — perhaps <code>e</code> gets <code>010</code>
     instead of <code>011</code>.</p>
     <p>All of those trees are optimal, so they all encode the text in the <strong>same total
     number of bits</strong>. If your codes differ from a classmate's, compare the totals rather
     than the code words.</p>
     <p>Slide 65's frequency table is from the sentence <em>"a fast runner need never be afraid of
     the dark"</em> — 46 characters over 16 distinct symbols. Fixed-width would need 4 bits each,
     so 184 bits. Huffman gives <strong>165</strong>. About 10%.</p>
     <p><strong>Why only 10%?</strong> Because these frequencies are not very skewed. Huffman's
     advantage grows with skew, and on a perfectly uniform distribution it saves
     <em>nothing at all</em> — which makes sense, since a flat distribution is exactly the
     assumption fixed-width coding already makes.</p>`,
   demo:"huffman",
   cp:{q:"Your Huffman codes differ from a classmate's on the same text. Which of you is wrong?",
       a:`Possibly neither. Equal frequencies make the tree non-unique, so code words can legitimately
          differ. Compare the <strong>total encoded length</strong> — every optimal tree produces
          the same one.`}}]},

{n:7,uke:"uke35",src:"Ch.9 slides 67–73",topic:"Longest common subsequence",
 blurb:"The algorithm inside git diff — and how dynamic programming turns 2^n into n×m.",
 concepts:[
  {t:"Subsequence is not substring",cite:"slide 68",
   plain:"A substring is a contiguous run. A subsequence lets you skip characters, as long as the ones you keep stay in order. 'bef' is a subsequence of 'abcdef' but not a substring of it.",
   body:`<p>This distinction is the entire reason the problem is harder than weeks 1–3.</p>
     <p>In <code>abcdef</code>, the substrings are the unbroken runs: <code>abc</code>,
     <code>cde</code>, and so on. But <code>bef</code> is a <em>subsequence</em> — take the
     <code>b</code>, skip <code>c</code> and <code>d</code>, take <code>e</code>, take
     <code>f</code>. Order preserved, gaps allowed.</p>
     <p>A string of length <code>n</code> has <strong><code>2ⁿ</code></strong> subsequences, one
     for every subset of positions you might keep. So slide 69's first suggestion — enumerate them
     all and pick the longest common one — is correct and completely useless: 60 characters gives
     you more subsequences than there are atoms in a planet.</p>
     <p>Slide 67 says why anyone cares: DNA relatedness, the difference between two versions of a
     file, and the Unix <code>diff</code> command. <strong>Every code review you have ever read
     is this algorithm's output</strong> — the unchanged lines are the longest common subsequence
     of the two versions.</p>`,
   cp:{q:"Slide 67 lists genetics, version control and diff. What is the shared question?",
       a:`How similar are two sequences, measured by the longest ordered set of elements they
          share. In DNA it suggests relatedness; between two file versions it is exactly the set
          of unchanged lines, which is what <code>diff</code> reports.`}},

  {t:"The recurrence, and why it's only two cases",cite:"slide 70",
   plain:"Compare the last character of each string. If they match, that character is in the answer — keep it and shrink both strings. If they don't, at least one of them is useless, so try dropping each and take whichever gave more.",
   body:`<p><code>L[i,j]</code> means: the length of the longest common subsequence of
     <code>X</code>'s first <code>i+1</code> characters and <code>Y</code>'s first
     <code>j+1</code>.</p>
     <p><strong>Case 1: <code>X[i] = Y[j]</code>.</strong> You have a character available to both.
     It is always at least as good to use it, so the answer is whatever you could manage with both
     strings one shorter, plus one: <code>L[i-1,j-1] + 1</code>.</p>
     <p><strong>Case 2: they differ.</strong> The subsequence cannot end with both characters —
     they are different characters. So at least one of them is not in the answer. You don't know
     which, so try both: drop <code>X</code>'s last and look at <code>L[i-1,j]</code>, or drop
     <code>Y</code>'s and look at <code>L[i,j-1]</code>. Take the bigger.</p>
     <p>Those two lookups are exactly the cell above and the cell to the left. That is why the
     algorithm is a grid you fill in.</p>
     <p><strong>Where the speed comes from:</strong> the same subproblems come up again and again,
     and the table means you solve each one once. <code>(n+1)(m+1)</code> cells, constant work
     each — <code>O(nm)</code> instead of <code>2ⁿ</code>.</p>`,
   code:`L[i,j] = L[i-1,j-1] + 1            if X[i] = Y[j]\nL[i,j] = max(L[i-1,j], L[i,j-1])   otherwise\n\nboundary:  L[i,-1] = 0     L[-1,j] = 0`,
   demo:"lcs",
   cp:{q:"Justify the max(L[i-1,j], L[i,j-1]) branch.",
       a:`If the last two characters differ, the common subsequence cannot end with both, so at
          least one is not in the answer. Try dropping each one and keep whichever result is
          longer.`}},

  {t:"The off-by-one that causes every LCS bug",cite:"indexing",
   plain:"The slides use index −1 for the empty case. In Python, −1 means 'the last element', not 'nothing'. Add a row and column of zeros to the table and shift everything by one.",
   body:`<p>Slide 70's boundary conditions are <code>L[i,-1] = 0</code> and
     <code>L[-1,j] = 0</code>: comparing anything against an empty string gives 0. Mathematically
     fine. In Python, <code>table[-1]</code> silently returns the <em>last</em> row, so the code
     runs and produces nonsense.</p>
     <p>The fix is mechanical. Build the table with one extra row and one extra column, all zeros,
     and let the shifted index do the work:</p>
     <ul>
       <li><code>table[i+1][j+1]</code> is the slide's <code>L[i,j]</code></li>
       <li><code>table[0][*]</code> and <code>table[*][0]</code> are the boundary zeros</li>
       <li>the answer sits at <code>table[n][m]</code></li>
       <li>comparing cell <code>[i+1][j+1]</code> means comparing <code>X[i]</code> to
         <code>Y[j]</code></li>
     </ul>
     <p>Get this straight on paper before typing. Nearly every LCS bug is this one.</p>`,
   demo:"lcs",
   cp:{q:"Why shift the DP table by one row and column instead of indexing from 0?",
       a:`The recurrence needs <code>L[i-1,j-1]</code> when <code>i = j = 0</code>, i.e. index −1.
          Python reads −1 as the last element rather than "empty", so an explicit zero row and
          column give the boundary a real home and <code>table[i+1][j+1]</code> becomes
          <code>L[i,j]</code>.`}}]},

{n:8,uke:"uke37",src:"NP-Completeness slides 1–11",topic:"NP-completeness",
 blurb:"Problems that are easy to state, easy to check, and that nobody knows how to solve.",
 concepts:[
  {t:"Vertex cover: easy to say, nobody can solve it",cite:"slide 2 · slide 15",
   plain:"Pick a set of vertices so that every edge in the graph has at least one end in your set. Now do it with as few vertices as possible. That second part is the problem nobody can do quickly.",
   body:`<p>Think of it as guarding corridors. The edges are corridors and the vertices are
     junctions; a guard at a junction watches every corridor touching it. A <strong>vertex
     cover</strong> is a set of junctions covering every corridor. You want the fewest guards.</p>
     <p>Checking a proposed set is trivial: walk the edges, confirm each has a guarded end.
     <em>Finding</em> the smallest is, as far as anyone knows, hopeless — the only reliable method
     is to try subsets, and there are <code>2ⁿ</code> of them.</p>
     <p>That gap is what this week is about. The statement fits in one sentence, the verification
     fits in two loops, and the search has resisted fifty years of effort.</p>`,
   demo:"vertexcover",
   cp:{q:"State the vertex cover problem, and say which part is hard.",
       a:`Given a graph, find a set of vertices such that every edge has at least one endpoint in
          the set — as small as possible. Checking a proposed cover is easy; finding a minimum one
          is what nobody can do in polynomial time.`}},

  {t:"Decision problems: the classes only talk about yes/no",cite:"slide 4",
   plain:"P, NP and NP-complete are defined for questions with a yes-or-no answer. So 'find the smallest cover' isn't technically in any of them — 'is there one of size at most k?' is.",
   body:`<p>Slide 4 is a definition slide that looks skippable and is not. A <strong>decision
     problem</strong> is one whose output is yes or no.</p>
     <p>This matters because "find the smallest vertex cover" produces a <em>set</em>, not a
     yes/no. So strictly it is not in NP at all — the <strong>decision version</strong>, "does
     this graph have a vertex cover of size at most <code>k</code>?", is the one the theory talks
     about.</p>
     <p>In practice the two versions are equally hard: solve the decision version for
     <code>k = 1, 2, 3…</code> and you have found the minimum. But keep the vocabulary straight,
     because the exam will ask which is which.</p>`,
   cp:{q:"Which of 'find a minimum vertex cover' and 'is there a cover of size ≤ k' is the NP-complete one, and why?",
       a:`The second. P, NP and NP-complete are defined over <strong>decision</strong> problems —
          yes/no outputs — so the optimisation version does not literally belong to those classes,
          even though the two are equally hard in practice.`}},

  {t:"NP means 'easy to check', not 'easy to solve'",cite:"slide 5 · slide 6",
   plain:"A problem is in NP if, when the answer is yes, someone can hand you the evidence and you can verify it quickly. Finding the evidence yourself may be impossible. That gap is the whole subject.",
   body:`<p><strong>P</strong> is the problems you can <em>solve</em> in polynomial time.</p>
     <p><strong>NP</strong> is bigger: it includes everything in P, plus every problem where a
     "yes" answer can be <em>verified</em> in polynomial time given the right evidence — a
     <strong>certificate</strong>.</p>
     <p>Slide 6 does vertex cover explicitly. Someone hands you a set <code>C</code>. You check
     <code>|C| ≤ k</code>, then walk every edge and confirm one endpoint is in <code>C</code>.
     Two loops. Fast. So vertex cover is in NP.</p>
     <p>Notice what the verifier deliberately does <strong>not</strong> do: it never searches.
     Given the answer, checking is easy. Without it, you are lost. That gap between
     <em>checking</em> and <em>finding</em> is exactly what P vs NP asks about — and slide 7 notes
     nobody knows, though most people believe P ≠ NP.</p>
     <p>A useful analogy: a sudoku is trivial to check and hard to solve. A jigsaw is easy to
     verify complete and slow to complete.</p>`,
   demo:"verify",
   cp:{q:"What exactly does a verifier for Vertex Cover do, and what does it not do?",
       a:`Given the graph, <code>k</code> and a proposed cover, it checks the size and that every
          edge has an endpoint in the set — polynomial time. It does <strong>not</strong> search
          for the cover. That gap between verifying and finding is what NP formalises.`}},

  {t:"Reductions: turning one problem into another",cite:"slides 8–9 · Ch.1 slide 14",
   plain:"To show your problem is hard, show that a known-hard problem can be rewritten as yours. If you could solve yours quickly, you could solve theirs quickly too — and theirs is known to be hopeless.",
   body:`<p>To prove a problem NP-complete you do two things: show it is in NP (give a verifier),
     and show a <strong>known</strong> NP-complete problem <em>reduces</em> to it in polynomial
     time.</p>
     <p>That needs somewhere to start, and the <strong>Cook–Levin theorem</strong> provides it:
     Boolean satisfiability is NP-complete, proved from first principles. Every later proof leans
     on it, directly or through a chain.</p>
     <p><strong>A reduction you can actually see.</strong> Chapter 1 slide 14 turns vertex cover
     into set cover:</p>
     <ul>
       <li>the <strong>ground set</strong> is the graph's <strong>edges</strong>;</li>
       <li>there is <strong>one subset per vertex</strong>, containing the edges that touch it.</li>
     </ul>
     <p>Picking vertex <code>v</code>'s subset = putting <code>v</code> in the cover. Covering all
     the edges = every edge has a chosen endpoint. Same problem, different clothes.</p>
     <p>One more cheap fact worth knowing: <code>C</code> is a vertex cover <strong>if and only
     if</strong> the vertices <em>not</em> in <code>C</code> form an independent set (no edge
     between any two of them). One line of proof, and it means minimum vertex cover and maximum
     independent set are the same problem.</p>`,
   cp:{q:"Give the reduction from Vertex Cover to Set Cover.",
       a:`Ground set = the edges of the graph. For each vertex, one subset containing exactly the
          edges incident to it. A collection of subsets covers the ground set precisely when the
          corresponding vertices cover every edge.`}}]},

{n:9,uke:"uke37",src:"NP slides 12–26 · Ch.1 slides 3–9",topic:"Approximation algorithms",
 blurb:"Give up on the perfect answer, but guarantee in advance how far off you can be.",
 concepts:[
  {t:"What an α-approximation actually promises",cite:"Definition 1.1 · slide 13",
   plain:"An algorithm that runs fast and always returns an answer at most α times worse than the best possible. The point is that you know α before you run it — it's a promise, not a hope.",
   body:`<p>You cannot solve these problems exactly. So relax the requirement: find something
     <em>close</em>, and be able to say how close.</p>
     <p>Formally, an <strong>α-approximation algorithm</strong> runs in polynomial time and always
     returns a feasible solution with <code>c(S) ≤ α·OPT</code>. Three words are doing work:</p>
     <ul>
       <li><strong>polynomial</strong> — otherwise just solve it exactly and stop pretending;</li>
       <li><strong>always</strong> — a guarantee over <em>every</em> input, not an average. One
         bad instance and the claim is false;</li>
       <li><strong>feasible</strong> — the answer has to actually be a solution. A fast wrong
         answer is not an approximation.</li>
     </ul>
     <p>Chapter 1 uses <code>α &gt; 1</code> for minimisation (at most twice as big) and
     <code>α &lt; 1</code> for maximisation (at least half as good), then warns that other books
     do it differently. Check which convention is in front of you.</p>
     <p>Slide 14 gives the range: some problems admit no finite <code>α</code> at all; others
     admit <code>α</code> as close to 1 as you like, at the cost of running time — that is a
     <strong>PTAS</strong>, one algorithm per <code>ε</code>, each a
     <code>(1+ε)</code>-approximation.</p>`,
   cp:{q:"Why is 'always' load-bearing in the definition of an α-approximation?",
       a:`It is a worst-case guarantee over every instance, not an average. A single input where
          the bound fails means the algorithm is not an α-approximation at all — which is what
          separates a guarantee from a heuristic.`}},

  {t:"Vertex cover in 2: take both ends, deliberately",cite:"slide 16 · slide 19",
   plain:"Pick any uncovered edge and add BOTH its endpoints. One would have been enough — taking two looks wasteful, and that waste is exactly what lets you prove you're within a factor of 2.",
   body:`<p>The algorithm: while edges remain, grab one, add both endpoints, delete every edge
     touching either. Repeat.</p>
     <p>Adding both looks obviously wasteful. Here is why it is the right move.</p>
     <p>The edges you picked share no endpoints — each pick deletes everything touching it — so
     they form a <strong>matching</strong>. Now, <em>any</em> vertex cover must cover each of those
     edges, and since they share no endpoints, it needs <strong>at least one distinct vertex per
     picked edge</strong>. So <code>OPT ≥ (number of picked edges)</code>.</p>
     <p>Your algorithm used exactly <strong>two</strong> per picked edge. Hence
     <code>|C| ≤ 2·OPT</code>.</p>
     <p><strong>Notice the shape of that argument, because every proof this fortnight has it.</strong>
     You never computed <code>OPT</code> — you cannot, that is the whole problem. Instead you found
     a <em>lower bound</em> on it that you <em>can</em> compute (the matching size) and compared
     against that.</p>`,
   demo:"vertexcover",
   cp:{q:"The proof never computes OPT. What does it compare against instead?",
       a:`A computable lower bound. The selected edges form a matching, and any cover needs at
          least one endpoint from each, so <code>OPT ≥ |matching|</code> — while the algorithm
          takes <code>2|matching|</code>.`}},

  {t:"The factor 2 can't be improved, and here's the proof",cite:"slide 20",
   plain:"The argument shows you're never worse than 2×. To show 2 is the real answer and not just a loose bound, you need an input where the algorithm actually is twice as bad. A set of disjoint edges does it.",
   body:`<p>Slide 19 proved <code>α ≤ 2</code>. That alone does not mean the algorithm <em>is</em>
     a 2-approximation and not secretly a 1.5-approximation — you need a witness.</p>
     <p>Take <code>k</code> disjoint edges (a perfect matching): <code>u₁–v₁</code>,
     <code>u₂–v₂</code>, and so on. No edge touches another.</p>
     <ul>
       <li><strong>The algorithm</strong> picks every edge in turn and takes both endpoints —
         all <code>2k</code> vertices.</li>
       <li><strong>The optimum</strong> takes one endpoint per edge — <code>k</code> vertices.</li>
     </ul>
     <p>Ratio exactly 2, for every <code>k</code>. So the bound is <strong>tight</strong>: the
     analysis was not lazy, the algorithm really is that bad in the worst case.</p>`,
   demo:"vertexcover",
   cp:{q:"Give an instance where the vertex-cover 2-approximation achieves ratio exactly 2.",
       a:`A perfect matching — <code>k</code> pairwise disjoint edges. The algorithm adds both
          endpoints of each, taking <code>2k</code>; one endpoint per edge, <code>k</code> in
          total, is an optimal cover.`}},

  {t:"TSP in 2: build a tree, walk it, take shortcuts",cite:"slides 21–26",
   plain:"Build the cheapest tree connecting all cities. Walk around it — that visits everything but repeats cities. Skip the repeats by going directly to the next new city. That tour is at most twice optimal.",
   body:`<p>Only works when costs satisfy the <strong>triangle inequality</strong>: going directly
     is never more expensive than going via somewhere else. Without that, TSP admits no finite
     approximation ratio at all.</p>
     <p>The three steps, and the reason each is fine:</p>
     <ol>
       <li><strong>Build a minimum spanning tree.</strong> Delete any edge from the optimal tour
         and what remains is a spanning tree — so <code>MST ≤ OPT</code>. Another computable
         lower bound.</li>
       <li><strong>Double every edge.</strong> Now every vertex has even degree, so an Euler tour
         exists: a walk using every edge exactly once and returning to the start. It costs
         <code>2·MST</code>, and it visits every city — but repeats some.</li>
       <li><strong>Shortcut.</strong> Walk the Euler tour, skipping cities already visited. By the
