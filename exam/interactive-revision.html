   body:`<p>If a dataset contains missing values, how can it be modified to be suitable for machine
     learning?</p>`,
   cp:{q:"V2025 Q4: how do you make a dataset with missing values usable for ML?",
       a:`Three options: <strong>drop the rows</strong> (fine if few are affected),
          <strong>drop the column</strong> (if most of it is missing or it isn't useful), or
          <strong>impute</strong>, usually with the <em>median</em> because it is robust to
          outliers (or mean, most frequent, or a model-based imputer). Optionally add an indicator
          column recording that a value was missing. Fit the imputer on the <strong>training set
          only</strong> and apply it to the test set, or test statistics leak into training.`}},

  {t:"Find three bugs in the house-price code",cite:"V2025 · Question 5 · 6 p",
   plain:"Revise: weeks 2–3. Six points is three problems × (problem + fix). There are more than three.",
   body:`<p>A student predicts sale prices from a CSV with columns <code>id, square_meters, num_rooms,
     year_built, city, price_sold</code> (e.g. <code>42, 2, 1971, Oslo, 2710000</code>). Identify three
     problems that will hurt the model's expected performance, and suggest fixes.</p>`,
   code:`import pandas as pd\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import accuracy_score\n\ndata = pd.read_csv('house_data.csv')\n\nX_train = data.drop('id')\ny_train = data['price_sold']\n\nmodel = RandomForestClassifier(n_estimators=100, max_depth=5)\nmodel.fit(data)\n\npreds_train = model.predict(X_train)\n\nscore = accuracy_score(y_true=y_train, y_pred=preds_train)\nprint('The mean squared error of the model predictions is:', score)`,
   cp:{q:"V2025 Q5: name at least three problems in the house-price code and how to fix each.",
       a:`<strong>1. Classification for a regression task.</strong> Price is continuous: use
          <code>RandomForestRegressor</code> and MSE/RMSE, not <code>accuracy_score</code> (the print
          even says MSE). <strong>2. The target is in the features.</strong>
          <code>X_train</code> still contains <code>price_sold</code>, and <code>fit(data)</code>
          never receives <code>y</code>. Use
          <code>X = data.drop(columns=['id', 'price_sold'])</code> and <code>fit(X, y)</code>.
          <strong>3. Evaluated on training data.</strong> With no held-out set the score says
          nothing about new homes, so use <code>train_test_split</code> first and score on the test
          set. <strong>4. <code>city</code> is text.</strong> One-hot encode it (and any other
          categorical column). Also: <code>drop('id')</code> without <code>columns=</code> looks
          for a <em>row</em> labelled id and crashes.`}},

  {t:"Mean squared error",cite:"V2025 · Question 7 · 2 p",
   plain:"Revise: lecture 4's evaluation slide — regression asks 'how close did we get?'",
   body:`<p>What is this loss function called, and what task is it best used for?
     <code>L = (1/m) Σ (ŷ⁽ⁱ⁾ − y⁽ⁱ⁾)²</code></p>
     <p>A cross entropy, regression · B cross entropy, classification · C mean absolute error,
     unsupervised · D mean squared error, regression</p>`,
   cp:{q:"V2025 Q7: name L = (1/m) Σ (ŷ − y)² and the task it suits.",
       a:`<strong>D — mean squared error, for regression.</strong> The average of squared
          differences between prediction and target. Squaring punishes large errors
          disproportionately, and RMSE is its square root, back in the target's units.`}},

  {t:"Rescue the churn project",cite:"V2025 · Question 22 · 10 p",
   plain:"Revise: all of weeks 1–3. This single question is a fifth of the ML points. List every problem in the brief before proposing anything.",
   body:`<p>An insurance company wants to find customers likely to switch provider, and the project
     is going badly. You know:</p>
     <ul>
       <li>Data comes from 30% of the company's customers: 200 who left in the last 5 years and
         1800 who (so far) stayed.</li>
       <li>Performance is measured as accuracy on a test set with the same class distribution as
         the training set.</li>
       <li>The first model, a decision tree, scored 90% accuracy <em>on the training set</em>. No
         further testing was done, because that was considered sufficient.</li>
       <li>All features are numerical or categorical, so feature engineering was not considered
         necessary.</li>
     </ul>
     <p>Using the ML project lifecycle, suggest how the project should be structured to improve
     performance on new data.</p>`,
   cp:{q:"V2025 Q22: what is wrong with the churn project, and how should it be restructured?",
       a:`<strong>Problems.</strong> (1) 200 of 2000 left, so predicting "stays" for everyone
          already scores <strong>90%</strong>: the tree may have learned nothing. (2) It was
          measured on <strong>training</strong> data, which can't detect overfitting. (3) Accuracy
          is the wrong metric for a rare class. (4) One model, untuned, with no validation.
          (5) Feature engineering was dismissed. (6) 30% of customers over 5 years may not
          represent today's customers (sampling bias, drift).
          <strong>Restructure along the lifecycle:</strong> frame the goal and a metric that
          matters (recall or F₁ on churners, a PR curve, and what a missed churner costs); check the
          sample is representative; make a <strong>stratified</strong> train/test split before
          exploring; engineer features (tenure, claims, price changes); compare several models
          against the trivial baseline with <strong>stratified k-fold CV</strong>; tune
          hyperparameters and the decision threshold; evaluate once on the test set; deploy and
          <strong>monitor</strong> for drift, retraining as behaviour changes.`}},

  {t:"Quick-fire 3: trees, forests, regularisation",cite:"V2025 · Q12, Q13, Q14, Q15, Q17, Q20 · 8 p",
   plain:"Revise: uke39 — the decision-tree, random-forest and regularisation concepts. Give the letter and say why.",
   body:`<p><strong>Q12</strong> What are decision trees mainly used for? A dimensionality reduction ·
     B classification and regression · C clustering · D estimating probabilities.</p>
     <p><strong>Q13</strong> Why does a random forest use random subsets of features? A interpretability ·
     B much lower computational cost · C to decorrelate the individual trees · D so all trees get the
     same information.</p>
     <p><strong>Q14</strong> What is <em>information gain</em>? A how much information is missing ·
     B how effective a split is, measured as impurity reduction · C the information in one feature ·
     D nodes divided by depth.</p>
     <p><strong>Q15</strong> Main disadvantage of a single tree against a random forest? A slower
     predictions · B sensitive to noise and overfits easily, especially when deep · C can't handle
     missing values · D harder to interpret.</p>
     <p><strong>Q17</strong> Which hyperparameter controls overfitting in a tree? A number of input
     features · B learning rate · C maximum depth · D feature importance.</p>
     <p><strong>Q20</strong> Main goal of regularisation? A better training performance · B keep the
     model from becoming too complex · C decrease the model's variance · D both B and C.</p>`,
   cp:{q:"V2025 Q12, Q13, Q14, Q15, Q17, Q20 — letter and one-line reason for each.",
       a:`<strong>Q12 B.</strong> Trees do both classification (Gini) and regression (MSE).
          <strong>Q13 C.</strong> Without feature randomness every tree splits on the same strong
          features, and averaging correlated trees cancels little. <strong>Q14 B.</strong> Parent
          impurity minus the size-weighted impurity of the children. <strong>Q15 B.</strong> Trees
          are high-variance, and a forest averages that away. D is backwards: a single tree is the
          <em>easier</em> one to read. <strong>Q17 C.</strong> B belongs to gradient methods, and
          D is an output, not a setting. <strong>Q20 D.</strong> Regularisation limits complexity,
          which lowers variance. It usually makes training performance slightly <em>worse</em>,
          which rules out A.`}},

  {t:"Quick-fire 4: gradient descent",cite:"V2025 · Q18, Q19 · 2 p",
   plain:"Revise: uke40, the update step and the three variants. Give the letter and say why.",
   body:`<p><strong>Q18</strong> Which is true about stochastic gradient descent (SGD)? A it uses the
     entire dataset to compute each gradient update · B it updates the parameters after examining one
     training example at a time · C it doesn't update the parameters until all the data is processed ·
     D it always finds the global minimum.</p>
     <p><strong>Q19</strong> What might happen if the learning rate is set too high? A it gets stuck
     in a local minimum · B it converges too slowly · C it overshoots the minimum and fails to
     converge · D it will definitely find the global minimum.</p>`,
   cp:{q:"V2025 Q18 and Q19 — letter and one-line reason for each.",
       a:`<strong>Q18 B.</strong> One example per update is what "stochastic" means. A and C both
          describe batch gradient descent, and no variant guarantees the global minimum unless the
          loss is convex, which rules out D. <strong>Q19 C.</strong> Too big a step jumps past the
          minimum and can land higher each time. B is what a learning rate that's too <em>low</em>
          does.`}}]},
{n:5,uke:"uke39",src:"Lecture 5 · notebooks 2.1–2.4 · HOML ch.4, 6, 7",topic:"Complexity, and the models that manage it",
 blurb:"Why a more flexible model can do worse, how to rein it in, and the trees and forests that do it for you.",
 concepts:[
  {t:"Parameters, hyperparameters, and the loss",cite:"Lecture 5 slides 6–12 · V2025 Q16",
   plain:"A model has numbers it learns for itself (the parameters) and numbers you have to choose before training starts (the hyperparameters). Training adjusts the parameters to make one number, the loss, as small as possible. Picking the hyperparameters is your job, and you do it with validation data.",
   body:`<p>The lecture writes every model as <code>ŷ = f(x, θ)</code>: a prediction made from a data
     point <code>x</code> and some parameters <code>θ</code>. A degree-3 polynomial is
     <code>ŷ = θ₀ + θ₁x + θ₂x² + θ₃x³</code>.</p>
     <p><strong>The four θs are parameters.</strong> Training finds them in two steps. First you
     define what "best" means, which here is the mean squared error
     <code>MSE = (1/N) Σ (yᵢ − ŷᵢ)²</code>. Then an optimisation algorithm makes it small. Linear
     regression can do this with a formula (week 1 has it), but most models have to get
     there numerically. Gradient descent, in uke40, is how.</p>
     <p>The number being minimised is the <strong>loss</strong>, also called the <em>cost</em> or
     <em>error function</em>. Each kind of task has its own.</p>
     <p><strong>The 3 is a hyperparameter.</strong> Nothing in the fitting chooses it; you do.
     Slide 12 sorts hyperparameters into three kinds:</p>
     <ul>
       <li>the <strong>form</strong> of the model (degree, tree depth, number of trees);</li>
       <li><strong>restrictions</strong> on the parameters (regularisation strength α, clipping);</li>
       <li>the <strong>optimisation</strong> itself (learning rate, batch size).</li>
     </ul>`,
   cp:{q:"Polynomial regression of degree M: which numbers are parameters, which is a hyperparameter, and why can't the training loss be used to choose M?",
       a:`θ₀ … θ_M are parameters, found by minimising MSE. M is a hyperparameter. Training MSE can
          never get worse as M grows: a higher-degree polynomial can copy a lower one by setting
          its extra θs to zero. So the training loss would always pick the largest M. Choose M on
          validation data instead.`}},

  {t:"Bias, variance, and reading a learning curve",cite:"Lecture 5 slide 13 · nb 2.1",
   plain:"A model that is too simple gets things wrong in the same way whatever data it sees. That is bias. A model that is too flexible changes a lot depending on exactly which data it got. That is variance. You can't get both to zero, so you look for the complexity where their sum is smallest.",
   body:`<p>Slide 13 fits three polynomials to the same points. <strong>M = 1</strong> underfits: a
     straight line can't bend to follow the data. <strong>M = 9</strong> overfits: it passes
     through every point and wiggles wildly between them. <strong>M = 4</strong> is the best
     trade-off.</p>
     <p><strong>Bias</strong> comes from the model's simplifying assumptions, such as "the data is
     a line" when it is really a curve. <strong>Variance</strong> is how much the fitted model
     would change if you trained it on a different sample. Notebook 2.1 splits the expected error
     at a point into three parts:</p>
     <p><code>Err(x) = Bias² + Variance + irreducible error</code></p>
     <p>The third part is noise in the data itself. No choice of model removes it.</p>
     <p><strong>How to tell which problem you have.</strong> A <em>learning curve</em> plots
     training error and validation error as the training set grows.</p>
     <ul>
       <li><strong>Underfitting (high bias):</strong> both curves level off high and close
         together. More data won't help, because the curves have already met. You need a more
         flexible model.</li>
       <li><strong>Overfitting (high variance):</strong> training error is low, validation error
         is much higher, and there is a gap between them. More data narrows the gap, and so does
         regularisation.</li>
     </ul>
     <p>Try it below. Raise the degree and watch training error keep falling while validation
     error turns and climbs.</p>`,
   demo:"poly",
   cp:{q:"Your learning curves level off at the same high error for training and validation. Is that a bias or a variance problem, and will more data help?",
       a:`High <strong>bias</strong>, meaning the model underfits. The curves have already met, so
          more data won't move them. Make the model more flexible: add features, raise the degree,
          or use less regularisation.`}},

  {t:"Regularisation: make large parameters cost something",cite:"Lecture 5 slides 14–16 · nb 2.2 · V2025 Q20",
   plain:"An overfitting polynomial has huge coefficients that cancel each other out. Regularisation adds the size of the coefficients to the loss, so the model has to earn every large one. The hyperparameter α sets how much they cost.",
   body:`<p>Slide 14 lists three ways to prevent overfitting: <strong>limit the complexity</strong>,
     <strong>regularise</strong>, or <strong>collect more data</strong>. Regularisation changes the
     objective to</p>
     <p><code>loss(ŷ, y) + α · norm(θ)</code></p>
     <p>Slide 15 gives three norms, each worked out for <code>θ = [2, 3]</code>:</p>
     <table class="tbl"><tr><th>norm</th><th>what it measures</th><th>[2, 3]</th><th>gives you</th></tr>
       <tr><td>L0</td><td>how many parameters are nonzero</td><td class="mono">2</td><td>—</td></tr>
       <tr><td>L1</td><td>sum of the absolute values</td><td class="mono">5</td><td><b>Lasso</b></td></tr>
       <tr><td>L2</td><td>Euclidean length</td><td class="mono">√13</td><td><b>Ridge</b></td></tr></table>
     <p>(Strictly, ridge penalises the <em>squared</em> length, <code>½ Σ θᵢ²</code>. That's the
     formula in notebook 2.2.)</p>
     <p><strong>What they do differently.</strong> Ridge shrinks every coefficient but rarely makes
     any of them exactly zero. Lasso drives the unimportant ones all the way to zero, so it is
     also a kind of feature selection. <strong>Elastic net</strong> mixes the two with a ratio
     <code>r</code>: <code>r = 0</code> is ridge and <code>r = 1</code> is lasso.</p>
     <p><strong>α is the dial.</strong> At α = 0 you have plain regression again. As α grows, every
     weight is pushed towards zero and the fit flattens. The more complex the model, the more α it
     needs. α is a hyperparameter, so you choose it on validation data.</p>
     <p>The notebook's advice: plain linear regression is rarely a good idea, so always include
     some regularisation. Use ridge by default. If you suspect only a few features matter, use
     elastic net with <code>r &gt; 0</code> rather than pure lasso. The notebook also puts
     <code>StandardScaler</code> in the pipeline before the model. The penalty treats every
     coefficient the same, so the features need to be on the same scale.</p>`,
   demo:"ridge",
   cp:{q:"You believe only 3 of your 50 features matter. Ridge or lasso, and what does notebook 2.2 actually recommend?",
       a:`Lasso's L1 penalty pushes coefficients all the way to zero, so it selects features. Ridge
          only shrinks them. But the notebook recommends <strong>elastic net with r &gt; 0</strong>
          rather than pure lasso in that situation.`}},

  {t:"Early stopping",cite:"nb 2.2 · HOML 4",
   plain:"Train one step at a time and check the validation error after each step. Keep the model from the step where that error was lowest. It prevents overfitting without changing the loss at all.",
   body:`<p>This works for models trained in passes (epochs), such as <code>SGDRegressor</code> now
     and neural networks later. Validation error falls at first, reaches a minimum, and then rises
     again as the model starts fitting the noise. Stop at the minimum.</p>
     <p><strong>It regularises in a different way.</strong> Ridge and lasso change the cost
     function. Early stopping leaves the cost function alone and limits <em>how far</em> the
     parameters can move from where they started. The notebook calls this restricting the
     reachable parameter space.</p>
     <p>The notebook's version trains with <code>max_iter=1, warm_start=True</code>, so each call
     to <code>fit</code> is one more epoch. It keeps a <code>deepcopy</code> of the best model so
     far. It trains every epoch and keeps the best, rather than stopping at the first rise. That's
     the safer choice, because validation error is noisy and can rise briefly before falling
     again.</p>`,
   cp:{q:"How is early stopping different in kind from ridge and lasso?",
       a:`Ridge and lasso change the cost function by adding a penalty. Early stopping leaves the
          cost function alone and limits how long training runs, which limits how far the
          parameters can move. Validation error decides when to stop.`}},

  {t:"A decision tree, and how CART grows one",cite:"nb 2.3 · HOML 6 · V2025 Q12, Q14",
   plain:"A decision tree is a stack of yes/no questions, each about one feature. To build it, the algorithm tries every feature and every threshold and keeps the split that leaves the two halves least mixed. Then it does the same inside each half.",
   body:`<p>Notebook 2.3 trains a depth-2 tree on the diabetes data using two features, glucose and
     BMI. The root asks <em>glucose ≤ 132.5?</em> You follow the answers down to a leaf, and the
     leaf gives the prediction.</p>
     <p><strong>Reading a node.</strong> <code>samples</code> is how many training rows reach the
     node. <code>value</code> is how many of those belong to each class. <code>gini</code> measures
     how mixed they are:</p>
     <p><code>G = 1 − Σ pₖ²</code></p>
     <p>where <code>pₖ</code> is the fraction of the node's rows in class <code>k</code>. G is 0
     when the node is pure. With two classes it can be at most 0.5, at a 50/50 split.</p>
     <p><strong>Worked, from the notebook.</strong> The root's left child has 397 rows: 316 not
     diabetic, 81 diabetic. <code>G = 1 − (316/397)² − (81/397)² ≈ 0.325</code>. Splitting it on
     BMI gives children of 101 rows (G 0.058) and 296 rows (G 0.388). The information gain is the
     parent's impurity minus the children's impurity, weighted by their sizes:</p>
     <p><code>0.325 − (101/397 · 0.058 + 296/397 · 0.388) ≈ 0.021</code></p>
     <p><strong>CART</strong> picks the feature <code>f</code> and threshold <code>t</code> that
     minimise</p>
     <p><code>J(f, t) = (m_left/m) · G_left + (m_right/m) · G_right</code></p>
     <p>then repeats inside each child. It stops at <code>max_depth</code>, when no split lowers the
     impurity, or when another limit is reached.</p>
     <p>CART is <strong>greedy</strong>. It takes the best split at each node and never looks
     ahead. Géron notes that finding the optimal tree is NP-complete, which connects this to the
     algorithms half: CART is a fast heuristic for a problem with no known efficient exact
     algorithm.</p>
     <p><strong>For regression</strong>, replace Gini with MSE. Each leaf predicts the mean of the
     rows that reach it. <strong>For probabilities</strong>, a leaf returns its class fractions.
     That's why every point that lands in the same leaf gets exactly the same probability, even a
     physically impossible one with glucose 20 and BMI 10.</p>`,
   demo:"gini",
   cp:{q:"A node holds 397 samples: 316 of one class and 81 of the other. What is its Gini impurity, and what does CART minimise when it chooses a split?",
       a:`<code>1 − (316/397)² − (81/397)² ≈ 0.325</code>. CART minimises the children's impurity
          weighted by size, <code>J = (m_left/m)·G_left + (m_right/m)·G_right</code>. It tries every
          feature and threshold and chooses greedily, one node at a time.`}},

  {t:"Why trees overfit, and what tames them",cite:"nb 2.3 · V2025 Q15, Q17",
   plain:"Left alone, a tree keeps splitting until every leaf is pure, which means it has memorised the training set. Its decision boundary is made only of horizontal and vertical steps. And a small change in the data can give a completely different tree.",
   body:`<p><strong>Unrestricted, a tree reaches 100% training accuracy.</strong> It keeps splitting
     until every leaf holds one class. On the diabetes data it is already overfitting badly at
     <code>max_depth = 4</code>.</p>
     <p><strong>The regularising hyperparameters</strong>, and which way to move each one:</p>
     <table class="tbl"><tr><th>hyperparameter</th><th>to regularise</th></tr>
       <tr><td><code>max_depth</code></td><td>decrease</td></tr>
       <tr><td><code>max_leaf_nodes</code></td><td>decrease</td></tr>
       <tr><td><code>max_features</code></td><td>decrease</td></tr>
       <tr><td><code>min_samples_split</code></td><td>increase</td></tr>
       <tr><td><code>min_samples_leaf</code></td><td>increase</td></tr>
       <tr><td><code>min_impurity_decrease</code></td><td>increase</td></tr></table>
     <p>In practice one of <code>max_depth</code>, <code>max_leaf_nodes</code> or
     <code>min_samples_leaf</code> is usually enough. The notebook also lists
     <code>min_impurity_split</code>, but scikit-learn removed it in version 1.0. Passing it
     now raises a <code>TypeError</code>, so leave it out.</p>
     <p><strong>Boundaries are axis-parallel.</strong> Each node tests one feature against one
     threshold, so every edge of the decision boundary is horizontal or vertical. A diagonal
     boundary can only be approximated by a staircase with many steps.</p>
     <p><strong>Trees are unstable.</strong> Change the random seed of the train/test split and you
     get a different tree, with different feature importances. Trees also have real strengths: they
     need no scaling, handle mixed feature types, and can be read directly. So the fix for their
     instability is not a better single tree. It is many trees.</p>`,
   cp:{q:"Name three DecisionTreeClassifier hyperparameters that regularise, and which way to move each.",
       a:`Any three of: <code>max_depth</code> ↓, <code>max_leaf_nodes</code> ↓,
          <code>max_features</code> ↓, <code>min_samples_split</code> ↑,
          <code>min_samples_leaf</code> ↑, <code>min_impurity_decrease</code> ↑.`}},

  {t:"Random forests: many unstable trees, averaged",cite:"nb 2.4 · HOML 7 · V2025 Q13, Q15",
   plain:"Train lots of trees, each on a slightly different random copy of the data, and let each look at only a few random features at every split. Every tree overfits in its own way. When you average them, most of those individual mistakes cancel out.",
   body:`<p>Every tree in a random forest gets two kinds of randomness:</p>
     <ol>
       <li><strong>Bootstrap sampling.</strong> Draw <code>n</code> rows from the <code>n</code>
         training rows <em>with replacement</em>, so some rows appear twice and some not at all.
         Training on bootstrap samples and combining the results is called <strong>bagging</strong>
         (bootstrap aggregating).</li>
       <li><strong>Random features at each split.</strong> At every node, the tree may consider only
         a random subset of the features, up to <code>max_features</code> of them.</li>
     </ol>
     <p><strong>Why the second kind matters.</strong> Without it, every tree would split on the same
     strong feature at the root and the trees would end up alike. Averaging trees that make the same
     mistakes doesn't cancel anything. The feature randomness makes the trees different, and
     that's what makes the averaging work.</p>
     <p><strong>How it predicts.</strong> For regression, average the trees' predictions. For
     classification, use <em>soft voting</em>: average the trees' <code>predict_proba</code>
     outputs and pick the class with the highest average.</p>
     <p><strong>A free validation set.</strong> A bootstrap sample of size <code>n</code> leaves out
     about <code>(1 − 1/n)ⁿ ≈ 1/e ≈ 37%</code> of the rows. Each tree can be tested on the rows it
     never saw. That's what <code>oob_score=True</code> does (HOML 7).</p>
     <p><strong>The hyperparameters that matter.</strong> The tree ones, with
     <code>max_depth</code> the most important and often the only one changed from its default.
     <code>n_estimators</code> is the number of trees. <code>n_jobs=-1</code> trains them on every
     CPU core.</p>`,
   cp:{q:"A random forest uses two kinds of randomness. Name both, and say why the second one is needed.",
       a:`Bootstrap samples of the rows (drawn with replacement), and a random subset of the
          features at each split. Without the feature randomness, every tree would split on the same
          strong features and the trees would be highly correlated. Averaging correlated trees
          removes little variance.`}},

  {t:"Boosting: each new model fixes the last one's mistakes",cite:"nb 2.4 · HOML 7",
   plain:"A forest trains its trees independently and averages them. Boosting trains them one after another, and aims each new small tree at whatever the ensemble so far still gets wrong. Many weak learners added together become a strong one.",
   body:`<p><strong>AdaBoost</strong> works by reweighting the training rows:</p>
     <ol>
       <li>Give every row the weight <code>1/m</code>.</li>
       <li>Train a weak learner, usually a <em>stump</em> (a tree of depth 1).</li>
       <li>Its weighted error rate is <code>r</code>. Give the learner the weight
         <code>α = η log((1 − r)/r)</code>.</li>
       <li>Multiply the weight of every row it got wrong by <code>exp(α)</code>, then renormalise
         so the weights sum to 1.</li>
       <li>Repeat. The final prediction is a vote weighted by each learner's α.</li>
     </ol>
     <p>Note that <code>r = 0.5</code> gives <code>α = 0</code>. A learner no better than a coin
     flip gets no say.</p>
     <p><strong>Gradient boosting</strong> adjusts the targets instead of the weights:</p>
     <ul>
       <li><code>F₀</code> = the mean of <code>y</code>, the best constant under MSE;</li>
       <li>fit a small tree <code>h₀</code> to the residuals <code>y − F₀(x)</code>;</li>
       <li><code>F₁ = F₀ + h₀</code>, and repeat: <code>h₁</code> fits
         <code>y − F₁(x)</code>, and so on.</li>
     </ul>
     <p><strong>Where the gradient is.</strong> The gradient of MSE with respect to the
     predictions is <code>−(2/m)(y − ŷ)</code>. The residuals are exactly the negative gradient, up
     to a constant. So adding a tree fitted to the residuals is a step of gradient descent, taken on
     the predictions rather than on the parameters. That means you can replace MSE with any
     differentiable loss. In practice each tree is scaled down by a learning rate before it is added
     (scikit-learn's default is 0.1).</p>
     <p>XGBoost and LightGBM are the fast implementations you will see on Kaggle. Stepping through
     the demo below, you should see the ensemble's fit sharpen one stump at a time.</p>`,
   demo:"boost",
   cp:{q:"In gradient boosting with squared error, what is each new tree trained to predict, and why is that called gradient descent?",
       a:`The residuals <code>y − F_{m−1}(x)</code>. The negative gradient of MSE with respect to
          the predictions is proportional to exactly those residuals, so adding a tree fitted to
          them is a gradient-descent step on the loss, taken on the predictions rather than on the
          parameters. It also means any differentiable loss can replace MSE.`}},

  {t:"No free lunch",cite:"Lecture 5 slide 18",
   plain:"It's been proven that no single method is best on every problem. So 'which model is best?' has no general answer, only 'which is best for this problem', and the way to find out is to test.",
   body:`<p>Slide 18 ends the lecture on the <strong>no-free-lunch theorem</strong>: there is
     provably no single machine learning method that works best on all problems.</p>
     <p>The slide gives two ways to choose instead: <strong>test</strong> and
     <strong>experience</strong>. Testing means comparing candidates on validation data or with
     cross-validation, never on the test set. Experience tells you what to try first. For tabular
     data like the Kaggle competition's, that's usually a tree ensemble. But experience only gives
     you a starting point. The validation score makes the decision.</p>`,
   cp:{q:"What does the no-free-lunch theorem say, and what does it force you to do in practice?",
       a:`No machine learning method is best on all problems. So you cannot pick a model in
          advance. You compare candidates on validation data or with cross-validation, and use
          experience only to decide which ones to try.`}}]},

{n:6,uke:"uke40",src:"Lecture 7 · notebooks 2.5–2.6 · HOML ch.4",topic:"Gradient descent",
 blurb:"How a model actually finds its parameters: choose a loss, follow its slope downhill, and pick the step size with care.",
 concepts:[
  {t:"Two ways to minimise the loss",cite:"Lecture 7 slides 3–6 · nb 2.5 · HOML 4",
   plain:"Training means making the loss as small as possible. For linear regression there is a formula that jumps straight to the answer, the normal equation. For almost every other model there isn't, so you start somewhere and walk downhill. That walk is gradient descent.",
   body:`<p>Lecture 7 writes linear regression with <code>n</code> features as</p>
     <p><code>ŷ = θ₀ + θ₁x₁ + … + θₙxₙ = θᵀx</code></p>
     <p>The second form needs a trick: add a feature <code>x₀ = 1</code> to every data point. Then
     <code>θ₀·x₀</code> is just <code>θ₀</code>, and the whole model is one dot product. Notebook
     2.5 does this with <code>X_b = np.c_[np.ones((m,1)), X]</code>, and you'll see
     <code>X_b</code> in every cell after that.</p>
     <p>Finding the best θ is two steps (slides 4–6):</p>
     <ol>
       <li><strong>Define "best" with a loss.</strong> For regression, usually the mean squared error
         <code>L = (1/N) Σ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾)²</code>.</li>
       <li><strong>Minimise it</strong>, either analytically or numerically.</li>
     </ol>
     <p><strong>Analytically</strong>, you set the derivative to zero and solve. For MSE that gives the
     <strong>normal equation</strong>, <code>θ̂ = (XᵀX)⁻¹Xᵀy</code>, the answer in one step. It's
     what <code>LinearRegression</code> computes, and ML week 1's closed form is its one-feature
     case. Slide 5's catch: <em>only possible in the linear case</em>. HOML 4 adds a second one:
     inverting <code>XᵀX</code> costs roughly <code>n^2.4</code> to <code>n³</code> in the number of
     features, so with many thousands of features it gets slow.</p>
     <p><strong>Numerically</strong>, you start from a guess and repeatedly improve it. Gradient descent
     is the general-purpose way to do that, and it's how logistic regression, neural networks and
     gradient boosting (uke39) are all trained.</p>`,
   cp:{q:"Linear regression has the normal equation. Why does lecture 7 bother with gradient descent at all?",
       a:`The normal equation only exists for a linear model with MSE. Most models have no
          closed-form minimum, so they have to be trained numerically, and gradient descent works for
          any differentiable loss. It also scales better when there are very many features, because
          inverting <code>XᵀX</code> costs about <code>n^2.4</code>–<code>n³</code>.`}},

  {t:"The gradient points uphill",cite:"Lecture 7 slides 6–9 · nb 2.5",
   plain:"The gradient is a list of slopes, one for each parameter. Together they point in the direction where the loss rises fastest. Step the opposite way and the loss goes down.",
   body:`<p>With one parameter the derivative says which way is uphill. With many parameters you take
     the derivative with respect to each one, holding the others fixed, and stack the results. That
     vector is the <strong>gradient</strong> <code>∇L(θ)</code>, and it lives in parameter space: it
     says how to change θ, not x.</p>
     <p>For MSE, slide 8 differentiates one parameter at a time:</p>
     <p><code>∂L/∂θⱼ = (2/N) Σ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾) · xⱼ⁽ⁱ⁾</code></p>
     <p>and slide 9 packs all of them into one matrix expression:</p>
     <p><code>∇L(θ) = (2/N) Xᵀ(Xθ − y)</code></p>
     <p><strong>How to read it.</strong> <code>Xθ − y</code> is the vector of residuals, prediction
     minus target, one per training point. Multiplying by <code>Xᵀ</code> weights each residual by
     that point's value of feature <code>j</code> and adds them up, which gives one slope per
     parameter. For <code>θ₀</code> the feature is the column of ones, so its slope is just the sum
     of the residuals.</p>
     <p><strong>A worked step.</strong> Two points, <code>(0, 2)</code> and <code>(2, 6)</code>,
     starting from <code>θ = (0, 0)</code>. Both predictions are 0, so the residuals are
     <code>−2</code> and <code>−6</code> and the MSE is <code>(4 + 36)/2 = 20</code>.</p>
     <ul>
       <li><code>∂L/∂θ₀ = (2/2)(−2 − 6) = −8</code></li>
       <li><code>∂L/∂θ₁ = (2/2)(0·(−2) + 2·(−6)) = −12</code></li>
     </ul>
     <p>Both slopes are negative, so raising either parameter lowers the loss. One step with
     <code>η = 0.1</code> gives <code>θ = (0.8, 1.2)</code>, and the MSE drops from 20 to 4.64. The
     line through both points is <code>θ = (2, 2)</code>, and repeated steps head there.</p>`,
   code:`X_b = np.c_[np.ones((m, 1)), X]          # the x₀ = 1 column\ngradients = 2/m * X_b.T.dot(X_b.dot(theta) - y)\n#           2/N     Xᵀ     (  Xθ       - y)`,
   cp:{q:"In ∇L = (2/N)Xᵀ(Xθ − y), what is Xθ − y, and what does multiplying by Xᵀ do to it?",
       a:`<code>Xθ − y</code> is the residual of every training point, prediction minus target.
          <code>Xᵀ</code> weights each residual by that point's value of feature <code>j</code> and
          sums, so you get one slope per parameter. For <code>θ₀</code>, whose feature is the column
          of ones, the slope is just the sum of the residuals (times <code>2/N</code>).`}},

  {t:"The update step, and the learning rate",cite:"Lecture 7 slides 10–12 · nb 2.5 · V2025 Q19",
   plain:"Take a step against the gradient: θ ← θ − η∇L. The learning rate η is how big a step. Too small and training takes forever. Too big and each step overshoots the bottom and lands higher up the other side, so the loss grows instead of shrinking.",
   body:`<p>Slide 10's loop is the whole algorithm:</p>
     <p><code>θ⁽ⁿ⁺¹⁾ = θ⁽ⁿ⁾ − η ∇L</code></p>
     <p><strong>η is a hyperparameter</strong>, in the "optimisation" group from lecture 5's slide 12.
     Nothing in training chooses it. Slide 12 shows the three outcomes:</p>
     <ul>
       <li><strong>too small:</strong> every step is safe but short, and you run out of epochs
         before you arrive;</li>
       <li><strong>about right:</strong> the loss falls quickly and settles;</li>
       <li><strong>too big:</strong> the step jumps past the minimum. If it lands higher than it
         started, the next gradient is bigger, so the next jump is bigger still. The loss
         <em>grows</em>, and the parameters run off to infinity.</li>
     </ul>
     <p><strong>How big is too big?</strong> It depends on how steep the bowl is, and that depends on
     the data. On the demo's 50 points from notebook 2.5, batch descent is stable up to
     η ≈ 0.52: 0.02 crawls, 0.1 is nearly there after 10 epochs, 0.5 zig-zags, and 0.6 blows up.
     Géron's figure 4-8 uses 0.02, 0.1 and 0.5 on 100 points, and there 0.5 is already too big.</p>
     <p><strong>The other choice is when to stop.</strong> Notebook 2.5 fixes the number of epochs
     (one epoch is one pass through the training data). Its "Your turn!" asks you to grid-search η
     for <code>n_epochs=100</code>. HOML 4 suggests setting many epochs and stopping once the
     gradient is tiny.</p>`,
   code:`theta = np.random.randn(2, 1)             # start anywhere\nfor epoch in range(n_epochs):\n    gradients = 2/N * X.T.dot(X.dot(theta) - y)\n    theta = theta - eta * gradients       # step downhill`,
   demo:"gd",
   cp:{q:"The training loss goes up every epoch and the parameters keep growing. What has happened, and what do you change?",
       a:`The learning rate is too high. Each step overshoots the minimum and lands higher on the
          other side, so the gradient and the next step both get bigger. Lower η, for example by a
          factor of 10. If the features aren't scaled, scale them too, because unscaled features
          force a much smaller η.`}},

  {t:"Local minima, plateaus, and why scaling matters",cite:"Lecture 7 slides 13–16 · HOML fig. 4-7 · nb 2.5",
   plain:"Gradient descent only sees the slope where it's standing. It can stop in a dip that isn't the lowest one, or crawl across a flat stretch. Linear regression has neither problem, because MSE is a single bowl. But if the features are on very different scales, the bowl becomes a long narrow valley and most of the steps are wasted.",
   body:`<p>Slides 14–15 name two practical problems:</p>
     <ul>
       <li><strong>A local minimum</strong> is a dip where every direction goes up, but which isn't
         the lowest point. The gradient there is zero, so gradient descent stops, and the model
         predicts badly.</li>
       <li><strong>A plateau</strong> is a nearly flat region. The gradient is tiny, so the steps are
         tiny, and it converges slowly.</li>
     </ul>
     <p><strong>Neither happens for linear regression.</strong> Notebook 2.5 points out that MSE for a
     linear model is <em>convex</em>: shaped like a bowl, with exactly one minimum. Neural networks
     are not convex, which is part of why they're harder to train.</p>
     <p><strong>Feature scaling (slide 16, Géron's figure 4-7).</strong> Suppose one feature runs from
     0 to 2 and another from 0 to 2000. A small change in the second one's θ moves the predictions
     a lot, so the loss is very steep in that direction and very flat in the other. The contours
     become long, thin ellipses.</p>
     <p>Now η is stuck. It has to be small enough not to overshoot in the steep direction, and that
     makes the steps in the flat direction tiny. The path zig-zags across the valley and inches along
     it. Standardise the features first and the bowl gets much rounder, so one η suits every direction.</p>
     <p>In the demo, switch to "x × 5". Then 0.1 diverges, the safe limit drops to about 0.036, and
     even 50 epochs at 0.02 don't reach the minimum. This is why notebook 2.2 puts a
     <code>StandardScaler</code> in front of ridge. Trees are the exception: they don't use gradients, so
     notebook 2.6 skips scaling for its random forest.</p>`,
   demo:"gd",
   cp:{q:"Gradient descent on unscaled features converges slowly, even though the MSE bowl still has only one minimum. Why?",
       a:`Unscaled features stretch the bowl into a long, narrow valley. η has to be small enough
          not to overshoot in the steep direction, so the steps along the flat direction are tiny
          and the path zig-zags. Standardising the features makes the contours round, so one
          learning rate works in every direction.`}},

  {t:"Batch, stochastic, mini-batch",cite:"Lecture 7 slides 17–19 · nb 2.5 · V2025 Q18",
   plain:"The three variants differ only in how many training points go into each gradient: all of them, one, or a small handful. Fewer points means cheaper steps and a noisier path.",
   body:`<table class="tbl"><tr><th>variant</th><th>points per gradient</th><th>updates per epoch</th><th>behaviour</th></tr>
       <tr><td><b>batch</b></td><td class="mono">N</td><td class="mono">1</td><td>smooth, but each step reads all the data</td></tr>
       <tr><td><b>stochastic (SGD)</b></td><td class="mono">1</td><td class="mono">N</td><td>very cheap steps, erratic path</td></tr>
       <tr><td><b>mini-batch</b></td><td class="mono">b, e.g. 20</td><td class="mono">N / b</td><td>in between, and fast on a GPU</td></tr></table>
     <p><strong>Batch</strong> needs the whole training set for every step, and the notebook points out
     that it often doesn't fit in memory.</p>
     <p><strong>Stochastic</strong> updates after every single example, so one epoch makes
     <code>N</code> updates. Each gradient is a noisy estimate from one point, so the path jitters.
     With a constant η it never settles: it keeps bouncing around the minimum. The fix is a
     <strong>learning schedule</strong> that shrinks η as training goes on. Notebook 2.5 writes one,
     and notes that it adds another hyperparameter to tune. The noise has an upside too: it can
     shake the parameters out of a shallow local minimum (HOML 4).</p>
     <p><strong>Mini-batch</strong> averages a small random batch. It's less noisy than SGD, far
     cheaper per step than batch, and the matrix form suits GPUs. It's what almost everyone uses, and
     notebook 2.5 warns that people often say "SGD" when they mean mini-batch.</p>
     <p>In scikit-learn, <code>SGDRegressor</code> trains a linear model by stochastic gradient
     descent. Try all three variants in the demo at η = 0.1, one epoch at a time.</p>`,
   demo:"gd",
   cp:{q:"1000 training points, batch size 50. How many parameter updates happen in one epoch of batch, mini-batch and stochastic gradient descent?",
       a:`<strong>1, 20 and 1000.</strong> Batch computes one gradient from all 1000 points.
          Mini-batch makes <code>1000/50 = 20</code> updates. Stochastic makes one update per
          point. More updates per epoch means cheaper, noisier steps.`}},

  {t:"Momentum, and gradients nobody derives by hand",cite:"Lecture 7 slides 20–22 · HOML appendix B",
   plain:"Momentum lets each step keep some of the previous step's speed, which smooths out zig-zags and carries you across flat stretches. And for real models nobody works out the gradient on paper: automatic differentiation computes it from the code for the loss.",
   body:`<p><strong>Momentum.</strong> Plain gradient descent only looks at the current slope. With
     momentum, the step is a running average of recent gradients:</p>
     <p><code>v ← βv − η∇L</code> &nbsp;then&nbsp; <code>θ ← θ + v</code></p>
     <p>with β around 0.9. In a narrow valley the side-to-side parts of the gradient keep changing
     sign, so they cancel out, while the part along the valley keeps pointing the same way and
     builds up speed. On a plateau the small gradients add up, so you cross it faster. Adam, RMSProp
     and Adagrad, which notebook 2.5 mentions, build on this idea. DAT255 covers them properly.</p>
     <p><strong>Automatic differentiation (slide 22).</strong> Working out
     <code>(2/N)Xᵀ(Xθ − y)</code> by hand was fine for a line. For a neural network with millions of
     parameters it isn't. Libraries like JAX, PyTorch and TensorFlow take the code that computes the
     loss and give you the gradient automatically. You write <code>predict</code> and
     <code>loss</code>, and that's all.</p>
     <p>In the slide's code, <code>jax.grad(loss, argnums=1)</code> returns a new function that
     computes ∂loss/∂θ. <code>argnums=1</code> means "differentiate with respect to the second
     argument", which is <code>theta</code>. The update line is exactly the one from concept 3.</p>`,
   code:`import jax\n\ndef predict(X, theta):\n    return X.dot(theta)\n\ndef loss(X, theta, y):\n    return ((predict(X, theta) - y)**2).mean()\n\nfor epoch in range(n_epochs):\n    theta = theta - eta * jax.grad(loss, argnums=1)(X, theta, y)`,
   cp:{q:"In the slide's JAX loop, what do you write yourself, and what does jax.grad give you?",
       a:`You write <code>predict</code> and <code>loss</code>. <code>jax.grad(loss,
          argnums=1)</code> returns a function that computes the gradient of the loss with respect
          to argument 1, which is <code>theta</code>. The update is still
          <code>θ ← θ − η·∇L</code>. You just never derive <code>∇L</code> by hand.`}},

  {t:"Hyperparameter search: grid, random, Bayesian",cite:"nb 2.6 · V2025 Q10, Q16",
   plain:"Gradient descent tunes the parameters. It can't tune the hyperparameters, because the validation score isn't a smooth function of things like tree depth. So you search: try every combination, try random ones, or let each result guide the next guess.",
   body:`<p>Why not gradient descent? A hyperparameter like <code>max_depth</code> is a whole number,
     and changing it changes the model's structure. The validation score jumps from one value to the
     next, so there is no slope to follow. Notebook 2.6 says it plainly: it's hard to write a
     cost function for this that gradient descent can minimise.</p>
     <p>Notebook 2.6 tunes a random forest on the California housing data three ways:</p>
     <ul>
       <li><strong>Grid search</strong> (<code>GridSearchCV</code>) tries every combination. Its grid
         is 5 values of <code>n_estimators</code> × 3 of <code>max_depth</code> × 3 of
         <code>max_features</code> = 45 settings. With 3-fold cross-validation that's 135 fits,
         and the cost multiplies with every hyperparameter you add.</li>
       <li><strong>Random search</strong> (<code>RandomizedSearchCV</code>) tries
         <code>n_iter</code> random combinations. For a fixed budget it covers wide ranges of many
         hyperparameters, which is V2025 Q10's answer. It guarantees nothing, and on the notebook's
         small grid it doesn't beat grid search.</li>
       <li><strong>Bayesian optimisation</strong> (<code>hyperopt</code>, with TPE) uses the scores it
         has already seen to choose the next setting to try, so it wastes fewer fits on bad
         regions.</li>
     </ul>
     <p><strong>The uke36 rule still applies.</strong> Each search compares settings by
     cross-validation on the training set. The test set is scored once, at the end, on the
     winner.</p>`,
   cp:{q:"A grid of 4 × 3 × 5 settings, searched with 5-fold cross-validation: how many models are fitted during the search? And why can't gradient descent tune max_depth?",
       a:`<strong>300.</strong> 60 settings × 5 folds. (<code>GridSearchCV</code> then refits the
          winner on all the training data, which makes 301.) <code>max_depth</code> is a whole number
          that changes the model's structure, so the validation score jumps between values and has
          no gradient to follow.`}}]}

]};

/* --- weeks 1-3: the pattern matching stepper ---------------------------- */
function traceBrute(T,P){
  const st=[], n=T.length, m=P.length;
  if(!m){ return [{i:0,j:0,cmp:0,note:"empty pattern matches at 0",done:true,hit:0}]; }
  let cmp=0;
  for(let i=0;i+m<=n;i++){
    let j=0;
    while(j<m){
      cmp++;
      const ok = T[i+j]===P[j];
      st.push({i,j,cmp,ok,note:ok?`T[${i+j}] = P[${j}] ✓`:`T[${i+j}] ≠ P[${j}] — shift right by 1`});
      if(!ok) break;
      j++;
    }
    if(j===m){ st.push({i,j:m-1,cmp,done:true,hit:i,note:`all ${m} matched — match at index ${i}`}); return st; }
  }
  st.push({i:n-m,j:0,cmp,done:true,hit:-1,note:"no match"});
  return st;
}
function traceBM(T,P){
  const st=[], n=T.length, m=P.length;
  if(!m) return [{i:0,j:0,cmp:0,done:true,hit:0,note:"empty pattern matches at 0"}];
  const last={}; [...P].forEach((c,k)=>last[c]=k);
  let cmp=0, i=m-1, j=m-1;
  while(i<=n-1){
    cmp++;
    const ok = P[j]===T[i];
    if(ok){
      if(j===0){ st.push({i,j,cmp,ok:true,done:true,hit:i,note:`reached the front — match at index ${i}`}); return st; }
      st.push({i,j,cmp,ok:true,note:`T[${i}] = P[${j}] ✓ — step back`});
      i--; j--;
    } else {
      const lc = last[T[i]]===undefined?-1:last[T[i]];
      const shift = m - Math.min(j, 1+lc);
      st.push({i,j,cmp,ok:false,
        note:`T[${i}]='${T[i]}' ≠ P[${j}] · last('${T[i]}')=${lc} · jump ${shift}`});
      i += shift; j = m-1;
    }
  }
  st.push({i:n-1,j:0,cmp,done:true,hit:-1,note:"no match"});
  return st;
}
function failureOf(P){
  const m=P.length, f=new Array(m).fill(0);
  let i=1,j=0;
  while(i<m){
    if(P[i]===P[j]){ f[i]=j+1; i++; j++; }
    else if(j>0){ j=f[j-1]; }
    else { f[i]=0; i++; }
  }
  return f;
}
function traceKMP(T,P){
  const st=[], n=T.length, m=P.length;
  if(!m) return [{i:0,j:0,cmp:0,done:true,hit:0,note:"empty pattern matches at 0"}];
  const f=failureOf(P);
  let cmp=0,i=0,j=0;
  while(i<n){
    cmp++;
    const ok = P[j]===T[i];
    if(ok){
      if(j===m-1){ st.push({i,j,cmp,ok:true,done:true,hit:i-m+1,
        note:`matched the last character — match starts at ${i-m+1} (i − m + 1)`}); return st; }
      st.push({i,j,cmp,ok:true,note:`T[${i}] = P[${j}] ✓`});
      i++; j++;
    } else if(j>0){
      st.push({i,j,cmp,ok:false,note:`mismatch · keep f(${j-1})=${f[j-1]} characters, i does not move`});
      j=f[j-1];
    } else {
      st.push({i,j,cmp,ok:false,note:`mismatch at j=0 · advance i`});
      i++;
    }
  }
  st.push({i:n-1,j:0,cmp,done:true,hit:-1,note:"no match"});
  return st;
}

/* --- week 4: tries ------------------------------------------------------- */
function buildTrie(words){
  const t={};
  words.forEach(w=>{ let n=t; for(const c of (w+"$")) n = n[c] = n[c]||{}; });
  return t;
}
function compressTrie(t){
  const out={};
  for(const [c,child] of Object.entries(t)){
    let label=c, node=child;
    while(Object.keys(node).length===1){ const only=Object.keys(node)[0]; label+=only; node=node[only]; }
    out[label]=compressTrie(node);
  }
  return out;
}
const countNodes = t => 1 + Object.values(t).reduce((n,c)=>n+countNodes(c),0);
const countLeaves = t => Object.keys(t).length===0 ? 1
  : Object.values(t).reduce((n,c)=>n+countLeaves(c),0);
function trieTree(t, depth){
  const ks=Object.keys(t).sort();
  return ks.map(k=>{
    const leaf = Object.keys(t[k]).length===0;
    return `<div class="tnode" style="margin-left:${depth*16}px">
      <span class="tlab ${leaf?"tleaf":""}">${esc(k)}</span></div>` + trieTree(t[k], depth+1);
  }).join("");
}

/* --- week 8-9: vertex cover --------------------------------------------- */
const GRAPHS = {
  "five-edge":[["a","b"],["b","c"],["c","d"],["d","a"],["a","c"]],
  "path":[["a","b"],["b","c"],["c","d"]],
  "triangle":[["a","b"],["b","c"],["a","c"]],
  "K4":[["a","b"],["a","c"],["a","d"],["b","c"],["b","d"],["c","d"]],
  "matching (tight!)":[["u1","v1"],["u2","v2"],["u3","v3"]]
};
function minCover(E){
  const vs=[...new Set(E.flat())].sort();
  const covers = C => E.every(([u,v])=>C.includes(u)||C.includes(v));
  for(let k=0;k<=vs.length;k++){
    const idx=Array.from({length:k},(_,i)=>i);
    while(true){
      const cand=idx.map(i=>vs[i]);
      if(covers(cand)) return cand;
      let p=k-1;
      while(p>=0 && idx[p]===vs.length-k+p) p--;
      if(p<0) break;
      idx[p]++; for(let q=p+1;q<k;q++) idx[q]=idx[q-1]+1;
    }
  }
  return vs;
}

    const opt=minCover(E), ratio=opt.length?(C.length/opt.length):1;

      <table class="tbl">

/* --- week 11: scheduling on identical machines --------------------------- */
function schedLocal(p,m){
  // slide 14 from the V2025-style start: every job on machine 1, in the order given
  const M=Array.from({length:m},()=>[]); p.forEach((_,j)=>M[0].push(j));
  const load=k=>M[k].reduce((s,j)=>s+p[j],0);
  const log=[];
  for(let guard=0;guard<1000;guard++){
    let mx=0; for(let k=1;k<m;k++) if(load(k)>load(mx)) mx=k;
    const l=M[mx][M[mx].length-1], fin=load(mx);
    let best=-1;
    for(let k=0;k<m;k++) if(k!==mx && (best<0 || load(k)<load(best))) best=k;
    if(best<0 || load(best)+p[l]>=fin){
      log.push(`job ${l+1} finishes last, at ${fin}, and would not finish earlier anywhere else — stop`); break;
    }
    log.push(`job ${l+1} finishes last, at ${fin} on M${mx+1} → move to M${best+1}, now finishes at ${load(best)+p[l]}`);
    M[mx].pop(); M[best].push(l);
  }
  return {M,log};
}
function schedList(p,m,order){
  const M=Array.from({length:m},()=>[]), L=new Array(m).fill(0), log=[];
  order.forEach(j=>{
    let k=0; for(let q=1;q<m;q++) if(L[q]<L[k]) k=q;
    log.push(`job ${j+1} (length ${p[j]}) → M${k+1}, the first machine free, at ${L[k]}`);
    M[k].push(j); L[k]+=p[j];
  });
  return {M,log};
}
function schedOpt(p,m){
  let best=Infinity; const L=new Array(m).fill(0);
  const idx=p.map((_,j)=>j).sort((a,b)=>p[b]-p[a]);
  (function go(i){
    if(i===idx.length){ best=Math.min(best,Math.max(...L)); return; }
    const seen=new Set();
    for(let k=0;k<m;k++){
      if(seen.has(L[k])) continue; seen.add(L[k]);
      L[k]+=p[idx[i]]; if(Math.max(...L)<best) go(i+1); L[k]-=p[idx[i]];
    }
  })(0);
  return best;
}

function tspAll(P){
  const V=Object.keys(P).sort((a,b)=>(+a)-(+b));
  const d=(u,v)=>Math.hypot(P[u][0]-P[v][0],P[u][1]-P[v][1]);
  const cost=t=>t.reduce((s,_,i)=>s+d(t[i],t[(i+1)%t.length]),0);
  const byLabel=(a,b)=>(+a)-(+b);
  // Prim from the lowest label, ties to the first edge found
  const inn=[V[0]], T=[];
  while(inn.length<V.length){
    let b=null;
    inn.forEach(u=>V.filter(v=>!inn.includes(v)).forEach(v=>{
      const w=d(u,v); if(!b||w<b.w-1e-9) b={u,v,w};
    }));
    inn.push(b.v); T.push([b.u,b.v]);
  }
  const mst=T.reduce((s,[u,v])=>s+d(u,v),0);
  const adj={}; V.forEach(v=>adj[v]=[]);
  T.forEach(([u,v])=>{adj[u].push(v);adj[v].push(u);});
  // double tree: walk the doubled tree depth-first, then shortcut
  const walk=[];
  (function dfs(n,par){ walk.push(n);
    adj[n].slice().sort(byLabel).forEach(c=>{ if(c!==par){ dfs(c,n); walk.push(n); } }); })(V[0],null);
  const dt=[...new Set(walk)];
  // Christofides: minimum perfect matching on odd vertices by exhaustive search
  const odd=V.filter(v=>adj[v].length%2===1);
  let match=[], mw=Infinity;
  (function go(rest,acc,w){
    if(w>=mw-1e-9) return;
    if(!rest.length){ match=acc.slice(); mw=w; return; }
    const [a,...r]=rest;
    r.forEach((b,i)=>{ acc.push([a,b]); go(r.filter((_,k)=>k!==i),acc,w+d(a,b)); acc.pop(); });
  })(odd,[],0);
  if(!odd.length) mw=0;
  const edges=[...T,...match], used=new Array(edges.length).fill(false), stack=[V[0]], euler=[];
  while(stack.length){
    const u=stack[stack.length-1];
    const nb=edges.map((e,i)=>({i,to:e[0]===u?e[1]:e[1]===u?e[0]:null}))
      .filter(x=>x.to!==null&&!used[x.i]).sort((x,y)=>byLabel(x.to,y.to));
    if(nb.length){ used[nb[0].i]=true; stack.push(nb[0].to); } else euler.push(stack.pop());
  }
  euler.reverse();
  const ch=[...new Set(euler)];
  // nearest addition
  let pr=null;
  for(let x=0;x<V.length;x++) for(let y=x+1;y<V.length;y++){
    const w=d(V[x],V[y]); if(!pr||w<pr.w-1e-9) pr={a:V[x],b:V[y],w};
  }
  const na=[pr.a,pr.b], naLog=[`closest pair ${pr.a}–${pr.b} (${pr.w.toFixed(2)}): tour ${pr.a} → ${pr.b} → ${pr.a}`];
  while(na.length<V.length){
    let b=null;
    na.slice().sort(byLabel).forEach(i=>V.filter(j=>!na.includes(j)).forEach(j=>{
      const w=d(i,j); if(!b||w<b.w-1e-9) b={i,j,w};
    }));
    const at=na.indexOf(b.i), nx=na[(at+1)%na.length], pv=na[(at-1+na.length)%na.length];
    const after=d(b.i,b.j)+d(b.j,nx)-d(b.i,nx), before=d(pv,b.j)+d(b.j,b.i)-d(pv,b.i);
    if(after<=before+1e-9) na.splice(at+1,0,b.j); else na.splice(at,0,b.j);
    naLog.push(`closest outside city is ${b.j}, next to ${b.i} (${b.w.toFixed(2)}) → ${na.join(" → ")} → ${na[0]}`);
  }
  const perms=a=>a.length<=1?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(q=>[x,...q]));
  const opt=Math.min(...perms(V.slice(1)).map(q=>cost([V[0],...q])));
  return {V,T,mst,walk,dt,odd,match,mw,euler,ch,na,naLog,opt,cost};
}

const SCORED = (()=>{
  let s=7; const rnd=()=>((s=s*1103515245+12345&0x7fffffff)/0x7fffffff);
  const rows=[];
  for(let i=0;i<40;i++) rows.push({y:0, p:Math.min(0.97,Math.max(0.02,0.30+0.22*(rnd()-0.5)*2))});
  for(let i=0;i<10;i++) rows.push({y:1, p:Math.min(0.98,Math.max(0.05,0.68+0.26*(rnd()-0.5)*2))});
  return rows;
})();
function confusionAt(t){
  let tp=0,fp=0,tn=0,fn=0;
  SCORED.forEach(r=>{ const pred=r.p>=t;
    if(r.y===1&&pred)tp++; else if(r.y===1)fn++; else if(pred)fp++; else tn++; });
  return {tp,fp,tn,fn};
}

/* --- ML week 4: degree and ridge, Gini, boosting -------------------------
   Seeded so the same points appear on every load: a demo whose numbers move
   between visits cannot be quoted back in a drill answer.                   */
function seeded(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ return Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r()); }
/* notebook 2.1's data: y = 2 + x + ½x² + noise, x in [-3, 3] */
const POLYDATA = (() => {
  const r = seeded(42), mk = n => Array.from({length:n}, () => {
    const x = 6*r()-3; return [x, 2 + x + 0.5*x*x + gauss(r)]; });
  return {train: mk(20), val: mk(60)};
})();
function solve(A, b){                         /* Gaussian elimination, partial pivoting */
  const n=b.length, M=A.map((row,i)=>row.concat([b[i]]));
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    const d=M[c][c]||1e-12;
    for(let r=c+1;r<n;r++){ const f=M[r][c]/d; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
  }
  const w=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){ let s=M[r][n]; for(let k=r+1;k<n;k++) s-=M[r][k]*w[k]; w[r]=s/(M[r][r]||1e-12); }
  return w;
}
/* PolynomialFeatures → StandardScaler → Ridge, as in notebooks 2.1 and 2.2.
   The intercept is not penalised, which is what scikit-learn does too.   */
function fitPoly(pts, deg, alpha){
  const feats = x => Array.from({length:deg}, (_,k) => (x/3)**(k+1));
  const X = pts.map(p => feats(p[0])), n = pts.length;
  const mu = Array.from({length:deg}, (_,k) => X.reduce((s,r)=>s+r[k],0)/n);
  const sd = Array.from({length:deg}, (_,k) => Math.sqrt(X.reduce((s,r)=>s+(r[k]-mu[k])**2,0)/n) || 1);
  const Z = X.map(r => r.map((v,k) => (v-mu[k])/sd[k]));
  const ym = pts.reduce((s,p)=>s+p[1],0)/n;
  const A = Array.from({length:deg}, (_,i) => Array.from({length:deg}, (_,j) =>
    Z.reduce((s,r)=>s+r[i]*r[j],0) + (i===j ? alpha + 1e-9 : 0)));
  const b = Array.from({length:deg}, (_,i) => Z.reduce((s,r,q)=>s+r[i]*(pts[q][1]-ym),0));
  const w = solve(A, b);
  const f = x => ym + feats(x).reduce((s,v,k)=>s+w[k]*(v-mu[k])/sd[k],0);
  return {f, w};
}
const mse = (f, pts) => pts.reduce((s,p)=>s+(p[1]-f(p[0]))**2,0)/pts.length;
const ALPHAS = [0, 1e-4, 1e-3, 0.01, 0.1, 1, 10, 100];

}

const BOOSTDATA = (() => { const r = seeded(7);
  return Array.from({length:40}, (_,i) => { const x = i*6/39;
    return [x, 3*Math.sin(x) + 0.6*x + 0.5*gauss(r)]; }); })();
function fitStump(pts, res){                  /* the best single split on x, under MSE */
  let best = {sse:Infinity};
  for(let k=1;k<pts.length;k++){
    const L=res.slice(0,k), R=res.slice(k);
    const ml=L.reduce((s,v)=>s+v,0)/L.length, mr=R.reduce((s,v)=>s+v,0)/R.length;
    const sse=L.reduce((s,v)=>s+(v-ml)**2,0)+R.reduce((s,v)=>s+(v-mr)**2,0);
    if(sse<best.sse) best={sse, t:(pts[k-1][0]+pts[k][0])/2, ml, mr};
  }
  return x => x <= best.t ? best.ml : best.mr;
}

/* --- ML week 6: gradient descent ------------------------------------------
   Notebook 2.5's data, y = 4 + 3x + noise with x in [0, 2]. The loss surface
   of linear regression is an exact quadratic, so its contours are ellipses
   drawn from the eigenvectors of XᵀX/m rather than traced numerically.      */
const GDDATA = (() => { const r = seeded(42);
  return Array.from({length:50}, () => { const x = 2*r(); return [x, 4 + 3*x + gauss(r)]; }); })();
const GD_START = [0, 0];
function gdSetup(stretch){
  const pts = GDDATA.map(([x,y]) => [x*stretch, y]), m = pts.length;
  const sx = pts.reduce((s,p)=>s+p[0],0)/m, sxx = pts.reduce((s,p)=>s+p[0]*p[0],0)/m;
  const sy = pts.reduce((s,p)=>s+p[1],0)/m, sxy = pts.reduce((s,p)=>s+p[0]*p[1],0)/m;
  const det = sxx - sx*sx;                               /* the normal equation, 2×2 */
  const opt = [(sxx*sy - sx*sxy)/det, (sxy - sx*sy)/det];
  const loss = t => pts.reduce((s,[x,y]) => s + (t[0] + t[1]*x - y)**2, 0)/m;
  const tr = 1 + sxx, dd = Math.sqrt((1 - sxx)**2/4 + sx*sx);   /* eigenvalues of XᵀX/m */
  const lam = [tr/2 + dd, tr/2 - dd];
  const vec = l => { const v = Math.abs(sx) > 1e-12 ? [sx, l - 1] : [1, 0], n = Math.hypot(...v); return [v[0]/n, v[1]/n]; };
  return {pts, m, opt, loss, lam, vecs: lam.map(vec), limit: 1/lam[0]};  /* diverges above η = 2/(2λmax) */
}
function gdRun(S, eta, batch, epochs, seed){
  const r = seeded(seed), path = [GD_START.slice()], L = [S.loss(GD_START)];
  let t = GD_START.slice(), blown = false;
  for(let e = 0; e < epochs && !blown; e++){
    const idx = S.pts.map((_,i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
    for(let s = 0; s < S.m && !blown; s += batch){
      const B = idx.slice(s, s + batch).map(i => S.pts[i]);
      let g0 = 0, g1 = 0;
      B.forEach(([x,y]) => { const res = t[0] + t[1]*x - y; g0 += res; g1 += res*x; });
      t = [t[0] - eta*2/B.length*g0, t[1] - eta*2/B.length*g1];
      path.push(t); L.push(S.loss(t));
      if(!isFinite(L[L.length-1]) || Math.abs(t[0]) + Math.abs(t[1]) > 1e6) blown = true;
    }
  }
  return {path, L, blown};
}

    const lpath = R.L.map((v,i) => (i?"L":"M") + lx(i).toFixed(1) + " " + ly(v).toFixed(1)).join("");

        <text x="${pad}" y="${H-6}" class="axt">θ₀ →</text>
        <text x="${pad}" y="${pad}" class="axt">θ₁ ↑</text>
      </svg>
      <svg viewBox="0 0 ${LW} ${LH}" class="plot" role="img" aria-label="training loss after each update">
        <line x1="${lp}" y1="${LH-lp}" x2="${LW-lp}" y2="${LH-lp}" class="ax"/>

        <path d="${lpath}" class="curve"/>

      </svg>
      <table class="tbl"><tr><th></th><th>θ₀</th><th>θ₁</th><th>MSE</th></tr>
        <tr><td><span class="key a"></span>after ${epochs} epoch${epochs===1?"":"s"} · ${R.path.length-1} updates</td>
          <td class="mono">${R.blown ? "—" : fmt(t[0])}</td><td class="mono">${R.blown ? "—" : fmt(t[1])}</td>
          <td class="mono ${R.blown || last > 1.05*Lopt ? "bad-t" : "ok-t"}">${R.blown ? "diverged" : fmt(last)}</td></tr>
        <tr><td><span class="key b"></span>normal equation</td><td class="mono">${S.opt[0].toFixed(3)}</td>
          <td class="mono">${S.opt[1].toFixed(3)}</td><td class="mono">${Lopt.toFixed(3)}</td></tr></table>
      <p class="demo-k">batch gradient descent diverges above η ≈ <b>${S.limit.toFixed(3)}</b> on this data</p>
      <p class="demo-n">${R.blown || (epochs > 0 && last > L0)

           keeps bouncing around the minimum instead of settling on it.`}</p>`;
  };

};

const ROUTINE = [
  ["Recall first","5 min","Drill the target week with the answers hidden, or clear your Shaky list. No reading yet."],
  ["Read one piece","15 min","The next unticked item below — one topic, not a chapter. Keep its Learn page open beside it."],

function weekIdx(n){ return weeks().findIndex(w => w.n === n); }
/* The uke being taught now, or the most recent one this half has had. */
function defaultTarget(){
  const past = STUDY[half].map(s => s.uke).filter(u => u.startsWith("uke") && +u.slice(3) <= NOW_UKE);
  return past.length ? past.sort().pop() : STUDY[half][0].uke;
}
function ukeLabel(u){ return u === "V2025" ? "Past exam" : "uke " + u.slice(3); }

function agendaHTML(){
  const day = d => new Date(d + "T00:00:00");
  const live = AGENDA.filter(a => TODAY >= day(a.from) && TODAY < new Date(day(a.to).getTime() + 86400000));
  if(!live.length) return "";
  return `<div class="card now-card">
    <h3>This week</h3>
    <ul>${live.map(a => {
      const left = a.due ? Math.ceil((new Date(a.due) - TODAY)/86400000) : null;
      return `<li>${a.html}${left !== null
        ? ` <span class="badge">${left <= 0 ? "closes today" : left === 1 ? "1 day left" : left + " days left"}</span>` : ""}</li>`;
    }).join("")}</ul></div>`;
}

function renderStart(){

  const drilledHere = drillItems.filter(x => S.drilled[cKey(half,x.w,x.c)]).length;
  const items = st.items.concat([{id:"drill-"+target,
    t:`Drill ${ukeLabel(target)} until every concept is ticked`, where:"Drill Room → Drill",
    what:`${drilledHere} of ${drillItems.length} drilled correctly so far. Write each answer before revealing it; misses go on the Shaky list.`,
    drillAll:true}]);
  const done = items.filter(it => S.plan[half+":"+it.id]).length;
  const next = items.find(it => !S.plan[half+":"+it.id]);
  const rough = shaky(half);
  const order = STUDY[half].slice().sort((a,b) => a.uke.localeCompare(b.uke));
  view.innerHTML = `

    <h2>What to do with the time you have</h2>
    <p class="lede">Pick the week to work on — this week, or one you missed or want to

        const its = s.items.map(it => half+":"+it.id).concat([half+":drill-"+s.uke]), d = its.filter(k => S.plan[k]).length;
        return `<button class="chip" data-t="${s.uke}" aria-pressed="${s.uke===target}">
          ${esc(ukeLabel(s.uke))}${s.uke===nowT?" · now":""} <span class="chip-n">${d}/${its.length}</span></button>`;

      <p class="work-d" style="margin:0">${esc(st.title)}</p>
    </div>
    <div class="card" style="margin-bottom:22px">
      <ol class="routine">${ROUTINE.map(([t,m,d],i) => `<li>
        <span class="r-n">${i+1}</span>
        <div><p class="work-b">${esc(t)} <span class="muted mono">${m}</span></p>
        <p class="work-d">${esc(d)}</p></div></li>`).join("")}</ol>
      <div class="pager" style="margin-top:6px">
        <button class="btn primary" id="s-drill">Drill ${esc(ukeLabel(target))}</button>
        ${rough.length ? `<button class="btn" id="s-shaky">Shaky list (${rough.length})</button>` : ""}
      </div>
    </div>
    <p class="score">${done} of ${items.length} done${next ? ` · next: ${esc(next.t)}` : " · week done — pick another, or ask for more"}</p>
    <div class="card stage">
      <h3>${esc(ukeLabel(target))} · ${esc(st.title)}</h3>
      ${items.map(it => {
        const k = half+":"+it.id, on = !!S.plan[k];
        const btns = (it.learn ? `<button class="btn sm" data-learn="${it.learn.join(",")}">Learn page</button>` : "")
          + (it.drillAll ? `<button class="btn sm" data-drillall="1">Drill it</button>` : "")
          + (it.work ? `<button class="btn sm" data-work="${it.work}">Work tab</button>` : "");
        return `<div class="work-item ${it === next ? "is-next" : ""}">
          <button class="tick" data-k="${k}" aria-pressed="${on}" aria-label="Mark done">${on?"✓":""}</button>
          <div style="min-width:0">
            <p class="work-b">${it === next ? `<span class="badge">Next</span> ` : ""}${esc(it.t)}</p>
            <div class="where">${esc(it.where)}</div>
            <p class="work-d">${esc(it.what)}</p>
            ${btns ? `<div class="row" style="margin:10px 0 0">${btns}</div>` : ""}
          </div></div>`;
      }).join("")}
    </div>
    <p class="foot">Ticks and your target week are kept in this browser only. The checklist is
      rewritten after each Canvas sync, so new weeks appear here as they are taught.</p>`;
  const drill = () => startDrill(drillItems);
  $("#s-drill").onclick = drill;
  const sh = $("#s-shaky"); if(sh) sh.onclick = () => startDrill(rough.map(r => ({w:r.w,c:r.c})));
  view.querySelectorAll("#s-target .chip").forEach(b => b.onclick = () => {

  });
  view.querySelectorAll(".tick").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if(S.plan[k]) delete S.plan[k]; else S.plan[k] = 1; save(); render();
  });
  view.querySelectorAll("[data-learn]").forEach(b => b.onclick = () => {
    const [n,c] = b.dataset.learn.split(",").map(Number); const i = weekIdx(n);
    if(i >= 0){ wi = i; ci = c; setMode("learn"); }
  });
  view.querySelectorAll("[data-drillall]").forEach(b => b.onclick = drill);
  view.querySelectorAll("[data-work]").forEach(b => b.onclick = () => {
    const i = weekIdx(+b.dataset.work); if(i >= 0){ wi = i; ci = 0; setMode("work"); }
  });
}

function seenCount(h){
  return WEEKS[h].reduce((n,w,i) =>
    n + w.concepts.filter((_,j) => S.seen[cKey(h,i,j)]).length, 0);
}
function totalConcepts(h){ return WEEKS[h].reduce((n,w) => n + w.concepts.length, 0); }
function drilledCount(h){
  return WEEKS[h].reduce((n,w,i) =>
    n + w.concepts.filter((_,j) => S.drilled[cKey(h,i,j)]).length, 0);
}
function shaky(h){
  const out = [];
  WEEKS[h].forEach((w,i) => w.concepts.forEach((c,j) => {
    if(S.wrong[cKey(h,i,j)]) out.push({w:i,c:j,t:c.t,week:w});
  }));
  return out;
}
